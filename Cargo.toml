[workspace]
resolver = "2"
members = [
    "crates/uqa-core",
    "crates/uqa-analysis",
    "crates/uqa-storage",
    "crates/uqa-scoring",
    "crates/uqa-fusion",
    "crates/uqa-operators",
    "crates/uqa-ml",
    "crates/uqa-graph",
    "crates/uqa-joins",
    "crates/uqa-planner",
    "crates/uqa-execution",
    "crates/uqa-sql",
    "crates/uqa-pg-wire",
    "crates/uqa-fdw",
    "crates/uqa-engine",
    "crates/uqa-api",
    "crates/uqa-cli",
]
# `fuzz/` is its own cargo-fuzz workspace; only nightly + cargo-fuzz
# can build it, so we exclude it from the regular workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Jaepil Jeong <jaepil@cognica.io>"]
repository = "https://github.com/cognica-io/uqa-rs"
homepage = "https://github.com/cognica-io/uqa-rs"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
uqa-core = { version = "0.1.0", path = "crates/uqa-core" }
uqa-analysis = { version = "0.1.0", path = "crates/uqa-analysis" }
uqa-storage = { version = "0.1.0", path = "crates/uqa-storage" }
uqa-scoring = { version = "0.1.0", path = "crates/uqa-scoring" }
uqa-fusion = { version = "0.1.0", path = "crates/uqa-fusion" }
uqa-operators = { version = "0.1.0", path = "crates/uqa-operators" }
uqa-ml = { version = "0.1.0", path = "crates/uqa-ml" }
uqa-graph = { version = "0.1.0", path = "crates/uqa-graph" }
uqa-joins = { version = "0.1.0", path = "crates/uqa-joins" }
uqa-planner = { version = "0.1.0", path = "crates/uqa-planner" }
uqa-execution = { version = "0.1.0", path = "crates/uqa-execution" }
uqa-sql = { version = "0.1.0", path = "crates/uqa-sql" }
uqa-pg-wire = { version = "0.1.0", path = "crates/uqa-pg-wire" }
uqa-fdw = { version = "0.1.0", path = "crates/uqa-fdw" }
uqa-engine = { version = "0.1.0", path = "crates/uqa-engine" }
uqa-api = { version = "0.1.0", path = "crates/uqa-api" }

# Shared external dependencies (versions added when first consumer pulls them in)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
parking_lot = "0.12"
rayon = "1.10"
regex = "1.11"
unicode-normalization = "0.1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher", "blob"] }
pg_query = "6.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
crc32fast = "1.4"
fs2 = "0.4"
lz4_flex = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
zstd = "0.13"

# Dev / test
proptest = "1.5"
rstest = "0.23"
criterion = { version = "0.5", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight with idiomatic numerics-heavy code or impose
# documentation overhead disproportionate to early-stage code.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# Float equality is fine in hot loops where we deliberately compare
# computed scores; tests use explicit epsilon comparisons.
float_cmp = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"
debug = true
