[workspace]
resolver = "2"
members = [
    "crates/uqa-core",
    "crates/uqa-analysis",
    "crates/uqa-storage",
    "crates/uqa-storage-redb",
    "crates/uqa-storage-sqlite",
    "crates/uqa-scoring",
    "crates/uqa-fusion",
    "crates/uqa-operators",
    "crates/uqa-ml",
    "crates/uqa-graph",
    "crates/uqa-joins",
    "crates/uqa-planner",
    "crates/uqa-execution",
    "crates/uqa-pg-query",
    "crates/uqa-sql",
    "crates/uqa-pg-wire",
    "crates/uqa-fdw",
    "crates/uqa-engine",
    "crates/uqa",
    "crates/uqa-client",
    "crates/uqa-api",
    "crates/uqa-cli",
    "crates/uqa-python",
    "crates/uqa-node",
    "crates/uqa-wasm",
    "examples/rust/extensibility",
    "examples/rust/graph-cypher",
    "examples/rust/storage-transactions",
    "examples/rust/unified-search",
    "examples/rust/vector-knn",
]
# `fuzz/` is its own cargo-fuzz workspace; only nightly + cargo-fuzz
# can build it, so we exclude it from the regular workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.5"
edition = "2021"
# This is the base license. Optional additional permissions and commercial
# terms are documented in LICENSING.md.
license = "AGPL-3.0-only"
authors = ["Jaepil Jeong <jaepil@cognica.io>"]
repository = "https://github.com/cognica-io/uqa-engine"
homepage = "https://github.com/cognica-io/uqa-engine"
readme = "README.md"
rust-version = "1.90"
exclude = ["/tests", "/benches", "/examples"]

[workspace.dependencies]
# Internal crates
uqa-core = { version = "0.1.5", path = "crates/uqa-core" }
uqa-analysis = { version = "0.1.5", path = "crates/uqa-analysis" }
uqa-storage = { version = "0.1.5", path = "crates/uqa-storage" }
uqa-storage-redb = { version = "0.1.5", path = "crates/uqa-storage-redb" }
uqa-storage-sqlite = { version = "0.1.5", path = "crates/uqa-storage-sqlite" }
uqa-scoring = { version = "0.1.5", path = "crates/uqa-scoring" }
uqa-fusion = { version = "0.1.5", path = "crates/uqa-fusion" }
uqa-operators = { version = "0.1.5", path = "crates/uqa-operators" }
uqa-ml = { version = "0.1.5", path = "crates/uqa-ml" }
uqa-graph = { version = "0.1.5", path = "crates/uqa-graph" }
uqa-joins = { version = "0.1.5", path = "crates/uqa-joins" }
uqa-planner = { version = "0.1.5", path = "crates/uqa-planner" }
uqa-execution = { version = "0.1.5", path = "crates/uqa-execution" }
uqa-pg-query = { version = "0.1.5", path = "crates/uqa-pg-query" }
uqa-sql = { version = "0.1.5", path = "crates/uqa-sql" }
uqa-pg-wire = { version = "0.1.5", path = "crates/uqa-pg-wire" }
uqa-fdw = { version = "0.1.5", path = "crates/uqa-fdw" }
uqa-engine = { version = "0.1.5", path = "crates/uqa-engine" }
uqa = { version = "0.1.5", path = "crates/uqa" }
uqa-client = { version = "0.1.5", path = "crates/uqa-client" }
uqa-api = { version = "0.1.5", path = "crates/uqa-api" }

# Shared external dependencies (versions added when first consumer pulls them in)
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
ciborium = "0.2"
thiserror = "1.0"
tracing = "0.1"
parking_lot = "0.12"
libc = "0.2"
windows-sys = "0.61"
smallvec = "1.15"
ahash = "0.8"
rayon = "1.10"
regex = "1.11"
unicode-normalization = "0.1"
num-bigint = "0.4"
num-traits = "0.2"
rusqlite = { version = "0.39", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "blob", "cache"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
argon2 = { version = "0.5", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
crc32fast = "1.4"
fs2 = "0.4"
lz4_flex = "0.13"
getrandom = "0.3"
icu_casemap = "=2.0.0"
icu_properties = "=2.0.2"
libm = "0.2"
redb = "4.1"
zstd = "0.13"
arrow-array = "58"
arrow-ipc = "58"
arrow-schema = "58"
duckdb = { version = "=1.10505.0", features = ["bundled", "parquet"] }
parquet = { version = "58", features = ["arrow"] }
pyo3 = "0.29"
napi = { version = "3.10", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "3.5"
napi-build = "2.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
secrecy = "0.10"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
zeroize = "1.8"

# Dev / test
proptest = "1.5"
rstest = "0.23"
criterion = { version = "0.5", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight with idiomatic numerics-heavy code or impose
# documentation overhead disproportionate to early-stage code.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# Float equality is fine in hot loops where we deliberately compare
# computed scores; tests use explicit epsilon comparisons.
float_cmp = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.release-stripped]
inherits = "release"
debug = false
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
