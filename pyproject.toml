[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "uqa"
version = "0.1.10"
description = "Python bindings and usql CLI for embedded UQA and local or Cloud HTTP SQL"
readme = "README.md"
requires-python = ">=3.8"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSING.md", "LICENSES/*.txt"]
authors = [{ name = "Jaepil Jeong", email = "jaepil@cognica.io" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
usql = "uqa.cli:main"

[project.urls]
Homepage = "https://github.com/cognica-io/uqa-engine"
Repository = "https://github.com/cognica-io/uqa-engine"
Licensing = "https://github.com/cognica-io/uqa-engine/blob/main/LICENSING.md"

[tool.maturin]
manifest-path = "crates/uqa-python/Cargo.toml"
module-name = "uqa._uqa"
python-source = "python"
strip = true
include = [{ path = "crates/*/benches/**/*.rs", format = "sdist" }]
