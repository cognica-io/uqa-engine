[package]
name = "uqa-planner"
# Keep integration sources in one linked harness; CI verifies every source is registered.
autotests = false
description = "Cost model, cardinality, DPccp join enumeration, optimizer rewrites"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
documentation = "https://docs.rs/uqa-planner"
exclude.workspace = true

[dependencies]
uqa-core = { workspace = true }
uqa-sql = { workspace = true }
uqa-operators = { workspace = true }
uqa-graph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
uqa-execution = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[bench]]
name = "planner"
harness = false

[lints]
workspace = true
