[package]
name = "uqa-planner"
description = "Cost model, cardinality, DPccp join enumeration, optimizer rewrites"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
uqa-core = { workspace = true }
uqa-sql = { workspace = true }
uqa-operators = { workspace = true }
uqa-storage = { workspace = true }
uqa-execution = { workspace = true }
uqa-graph = { workspace = true }
uqa-joins = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

# The browser (emscripten) target runs single-threaded; rayon is
# native-only and parallel.rs keeps sequential twins for every site.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "planner"
harness = false

[lints]
workspace = true
