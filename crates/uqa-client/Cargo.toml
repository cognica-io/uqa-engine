[package]
name = "uqa-client"
description = "Authenticated HTTP Engine client for local and Cloud UQA data planes"
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
documentation = "https://docs.rs/uqa-client"
exclude.workspace = true
keywords = ["database", "sql", "http", "postgresql"]
categories = ["database"]

[dependencies]
getrandom.workspace = true
httpdate.workspace = true
hyper.workspace = true
reqwest.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "time"] }
uqa-core.workspace = true
uqa-sql.workspace = true
zeroize.workspace = true

[dev-dependencies]
axum.workspace = true
log = "0.4"
tempfile = "3.13"
tokio.workspace = true
tracing.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
