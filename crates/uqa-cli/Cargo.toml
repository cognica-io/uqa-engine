[package]
name = "uqa-cli"
# Keep integration sources in one linked harness; CI verifies every source is registered.
autotests = false
description = "usql: interactive REPL for UQA"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
documentation = "https://docs.rs/uqa-cli"
exclude.workspace = true
keywords = ["database", "sql", "postgresql", "repl"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "usql"
path = "src/main.rs"
test = false

[dependencies]
uqa-engine = { workspace = true }
uqa-core = { workspace = true }
uqa-fdw = { workspace = true }
uqa-graph = { workspace = true }
uqa-pg-query = { workspace = true }
uqa-sql = { workspace = true }
rustyline = "18.0.0"
rpassword = "7.4"
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3.13"

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
