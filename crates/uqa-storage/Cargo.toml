[package]
name = "uqa-storage"
# Keep integration sources in one linked harness; CI verifies every source is registered.
autotests = false
description = "Document store, inverted index, IVF/HNSW vectors, B-tree, R*Tree, catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
documentation = "https://docs.rs/uqa-storage"
exclude.workspace = true

[dependencies]
uqa-core = { workspace = true }
uqa-analysis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
parking_lot = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
allocation-counter = "=0.8.1"
tempfile = "3.13"
criterion = { workspace = true }
proptest = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[bench]]
name = "spatial"
harness = false

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "nori_storage"
harness = false
required-features = ["uqa-analysis/nori"]

[lints]
workspace = true
