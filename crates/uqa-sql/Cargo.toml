[package]
name = "uqa-sql"
# Keep integration sources in one linked harness; CI verifies every source is registered.
autotests = false
description = "PostgreSQL-compatible SQL compiler built on libpg_query"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
documentation = "https://docs.rs/uqa-sql"
exclude.workspace = true

[dependencies]
uqa-core = { workspace = true }
uqa-pg-query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
crc32fast = { workspace = true }
getrandom = { workspace = true }
icu_casemap = { workspace = true }
libm = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
errno = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
