[package]
name = "uqa"
description = "Convenience facade for the embedded UQA engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/uqa"
readme = "README.md"
rust-version.workspace = true
exclude.workspace = true
keywords = ["database", "sql", "full-text-search", "vector-search", "graph"]
categories = ["database-implementations"]

[features]
default = []
nori = ["uqa-engine/nori"]
kuromoji = ["uqa-engine/kuromoji"]

[dependencies]
uqa-core = { workspace = true }
uqa-engine = { workspace = true, default-features = false }

[dev-dependencies]
allocation-counter = "=0.8.1"
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3.13"
uqa-storage-sqlite = { workspace = true }

[target.'cfg(not(target_os = "emscripten"))'.dev-dependencies]
uqa-storage-redb = { workspace = true }

[[bench]]
name = "nori_sql"
harness = false
required-features = ["nori"]

[lints]
workspace = true
