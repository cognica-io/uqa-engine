[package]
name = "uqa-python"
description = "Python bindings and usql CLI for embedded UQA and local or Cloud HTTP SQL"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["nori"]
nori = ["uqa-engine/nori"]

[lib]
name = "_uqa"
crate-type = ["cdylib", "rlib"]

[dependencies]
uqa-storage-sqlite = { workspace = true }
pyo3 = { workspace = true, features = ["abi3-py38", "multiple-pymethods"] }
serde_json = { workspace = true }
tokio.workspace = true
uqa-cli.workspace = true
uqa-client.workspace = true
uqa-core = { workspace = true }
uqa-engine = { workspace = true, default-features = false }
uqa-scoring = { workspace = true }
uqa-sql = { workspace = true }

[lints]
workspace = true
