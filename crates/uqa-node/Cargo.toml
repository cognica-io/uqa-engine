[package]
name = "uqa-node"
description = "Node.js bindings for embedded UQA and local or Cloud HTTP SQL"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["nori"]
nori = ["uqa-engine/nori"]

[lib]
name = "uqa_node"
crate-type = ["cdylib"]

[dependencies]
uqa-storage-sqlite = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = { workspace = true }
tokio.workspace = true
uqa-client.workspace = true
uqa-core = { workspace = true }
uqa-engine = { workspace = true, default-features = false }
uqa-scoring = { workspace = true }
uqa-sql = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

# Unit-test binaries run outside a Node.js host, so resolve Node-API symbols
# dynamically during test builds instead of asking the native linker for
# symbols that only the host process exports. Normal addon builds keep the
# lean, statically declared Node-API surface above.
[dev-dependencies]
napi = { workspace = true, features = ["dyn-symbols"] }

[lints]
workspace = true
