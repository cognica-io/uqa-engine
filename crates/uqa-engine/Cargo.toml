[package]
name = "uqa-engine"
# Link by resource domain instead of once per source; CI verifies every source is registered.
autotests = false
description = "Engine: schema-aware table store, catalog restore, transactions"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
documentation = "https://docs.rs/uqa-engine"
exclude.workspace = true
keywords = ["database", "sql", "postgresql", "full-text-search", "vector-search"]
categories = ["database-implementations"]

[dependencies]
uqa-core = { workspace = true }
uqa-analysis = { workspace = true }
uqa-storage = { workspace = true }
uqa-scoring = { workspace = true }
uqa-operators = { workspace = true }
uqa-ml = { workspace = true }
uqa-fusion = { workspace = true }
uqa-sql = { workspace = true }
uqa-graph = { workspace = true }
uqa-joins = { workspace = true }
uqa-planner = { workspace = true }
uqa-execution = { workspace = true }
uqa-fdw = { workspace = true }
ahash = { workspace = true }
parking_lot = { workspace = true }
libc = { workspace = true }
regex = { workspace = true }
smallvec = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
sha2 = { workspace = true }
tempfile = "3.13"
thiserror = { workspace = true }

# SQLCipher's crypto provider does not exist on the browser target;
# emscripten builds bundle plain SQLite instead.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
rusqlite = { workspace = true }

[target.'cfg(target_os = "emscripten")'.dependencies]
rusqlite = { version = "0.39", default-features = false, features = ["bundled", "blob", "cache"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
uqa-storage-redb = { workspace = true }
uqa-storage-sqlite = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }
duckdb = { workspace = true }
arrow-array = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

