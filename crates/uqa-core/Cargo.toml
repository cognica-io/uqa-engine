[package]
name = "uqa-core"
# Keep integration sources in one linked harness; CI verifies every source is registered.
autotests = false
description = "Document sets, finite-support relations, posting storage, and value types for UQA"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
documentation = "https://docs.rs/uqa-core"
exclude.workspace = true

[dependencies]
chrono = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
triomphe = { workspace = true }

[dev-dependencies]
allocation-counter = "=0.8.1"
proptest = { workspace = true }
criterion = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[bench]]
name = "posting_list"
harness = false

[[bench]]
name = "carrier_layers"
harness = false

[lints]
workspace = true
