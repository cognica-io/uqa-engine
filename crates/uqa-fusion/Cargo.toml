[package]
name = "uqa-fusion"
# Keep integration sources in one linked harness; CI verifies every source is registered.
autotests = false
description = "Exact Bayesian evidence fusion and robust multi-signal retrieval pooling"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
documentation = "https://docs.rs/uqa-fusion"
exclude.workspace = true

[dependencies]
uqa-core = { workspace = true }
uqa-scoring = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[bench]]
name = "fusion"
harness = false

[lints]
workspace = true
