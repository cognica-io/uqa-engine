[package]
name = "uqa-analysis"
description = "Tokenizers, char/token filters, and analyzers for UQA full-text search"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
documentation = "https://docs.rs/uqa-analysis"
exclude.workspace = true

[features]
default = []
nori = ["dep:sha2", "dep:miniz_oxide", "dep:uqa-nori-data"]
nori-tools = ["nori"]

[dependencies]
uqa-core = { workspace = true }
regex = { workspace = true }
unicode-normalization = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true, optional = true }
miniz_oxide = { workspace = true, optional = true }
uqa-nori-data = { workspace = true, optional = true }

[dev-dependencies]
uqa-nori-data = { workspace = true }
tempfile = "3.13"

[[example]]
name = "pack_nori"
required-features = ["nori-tools"]

[lints]
workspace = true
