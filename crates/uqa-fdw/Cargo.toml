[package]
name = "uqa-fdw"
description = "Foreign data wrappers (DuckDB, Arrow IPC)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
documentation = "https://docs.rs/uqa-fdw"
exclude.workspace = true

[features]
default = []
duckdb = ["dep:duckdb"]

[dependencies]
uqa-core = { workspace = true }
thiserror = { workspace = true }

# Native handlers are unavailable in the browser; DuckDB also requires
# explicit feature selection on native targets.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
arrow-array = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
duckdb = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3.13"

[lints]
workspace = true
