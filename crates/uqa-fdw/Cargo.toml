[package]
name = "uqa-fdw"
description = "Foreign data wrappers (DuckDB, Arrow IPC)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
documentation = "https://docs.rs/uqa-fdw"
exclude.workspace = true

[dependencies]
uqa-core = { workspace = true }
thiserror = { workspace = true }

# DuckDB and Arrow wrap native C/C++ engines that cannot target the
# browser; the emscripten build keeps only the registry types and the
# in-memory handler.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
arrow-array = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
duckdb = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3.13"

[lints]
workspace = true
