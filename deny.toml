# cargo-deny configuration for uqa-rs.
#
# Run locally (after `cargo install cargo-deny --locked`):
#
#   cargo deny --workspace check
#
# CI runs the same command; any drift in advisories, licenses, or
# banned crates fails the build.

[graph]
# Match the workspace's MSRV target tier.
all-features = true

[advisories]
version = 2
# In v2, cargo-deny errors on vulnerability, unmaintained, unsound, and notice
# advisories. Keep any intentional transitive unmaintained exceptions explicit.
yanked = "deny"
ignore = [
    # `paste` is pulled transitively through Arrow/Parquet. RUSTSEC marks it
    # unmaintained and offers no safe upgrade; keep this explicit so real
    # vulnerability advisories still fail the gate.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Allow only OSI-approved permissive or copyleft licenses we have
# already vetted. Anything outside this list trips the gate so it
# gets a human review.
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# Keep non-project-wide licenses scoped to the crates that require them.
exceptions = [
    # These crates carry the Mozilla CA root dataset under CDLA-Permissive-2.0.
    # DuckDB pulls webpki-roots; the HTTPS client pulls webpki-root-certs.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
# Set to `deny` once we've audited the dep tree for accidental
# duplicates. Today we surface them as warnings so the gate doesn't
# false-fire on transitive churn during early development.
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/jaepil/pg_query.rs"]
