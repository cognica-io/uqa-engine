[profile.ci]
# Every failure remains visible; a stuck test must not occupy a runner for six hours.
retries = 0
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 10, grace-period = "10s" }

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[test-groups.native-session-schedules]
max-threads = 1

[[profile.ci.overrides]]
filter = 'package(=uqa-engine) & test(native_session_groups_preserve_metadata_under_concurrent_load)'
test-group = 'native-session-schedules'
