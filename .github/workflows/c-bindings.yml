name: C bindings

on:
  pull_request:
    types: [ready_for_review]
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - "examples/c/**"
      - scripts/verify-c-examples.py
      - scripts/verify-c-clients.py
      - scripts/verify-c-xml-isolation.py
      - .github/workflows/c-bindings.yml
  workflow_call:

permissions:
  contents: read

concurrency:
  group: c-bindings-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  consumers:
    name: C and C++ (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        features:
          - minimal
          - default
          - arrow
          - duckdb
          - arrow,duckdb
          - arrow-export
          - arrow-export,arrow
          - arrow-export,duckdb
          - arrow-export,arrow,duckdb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: c-${{ matrix.features }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Execute C ABI clients on all four storage providers
        shell: bash
        run: |
          args=()
          if [[ '${{ matrix.features }}' != default ]]; then
            args+=(--no-default-features)
          fi
          if [[ '${{ matrix.features }}' != minimal && '${{ matrix.features }}' != default ]]; then
            args+=(--features '${{ matrix.features }}')
          fi
          cargo test -p uqa-ffi --locked --test integration "${args[@]}"
      - name: Execute five public examples as C11 and C++17
        shell: bash
        run: |
          suffix=so
          if [[ "$RUNNER_OS" == macOS ]]; then suffix=dylib; fi
          python3 scripts/verify-c-examples.py --library "target/debug/deps/libuqa_ffi.$suffix"
          python3 scripts/verify-c-xml-isolation.py --library "target/debug/deps/libuqa_ffi.$suffix"
      - name: Instrument the example consumers with ASan and UBSan
        shell: bash
        run: |
          suffix=so
          if [[ "$RUNNER_OS" == macOS ]]; then suffix=dylib; fi
          python3 scripts/verify-c-examples.py --sanitize --library "target/debug/deps/libuqa_ffi.$suffix"
          python3 scripts/verify-c-clients.py --sanitize --library "target/debug/deps/libuqa_ffi.$suffix"

  native-sanitizers:
    name: Native ASan (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        features: [minimal, arrow-export]
    env:
      CC: clang
      CXX: clang++
      CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      RUSTFLAGS: -Zsanitizer=address -Zexternal-clangrt -Cforce-frame-pointers=yes -Clinker=clang -Clink-arg=-fsanitize=address,undefined
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh
      - name: Instrument Rust, its standard library and native dependencies
        shell: bash
        run: |
          target=$(rustc +nightly -vV | sed -n 's/^host: //p')
          args=(--no-default-features)
          if [[ '${{ matrix.features }}' != minimal ]]; then
            args+=(--features '${{ matrix.features }}')
          fi
          cargo +nightly build --locked -Zbuild-std --target "$target" --profile test -p uqa-ffi "${args[@]}"
          cargo +nightly test --locked -Zbuild-std --target "$target" -p uqa-ffi --test integration "${args[@]}" -- --skip native::
          suffix=so
          if [[ "$RUNNER_OS" == macOS ]]; then suffix=dylib; fi
          python3 scripts/verify-c-clients.py --sanitize --library "target/$target/debug/libuqa_ffi.$suffix"
          python3 scripts/verify-c-examples.py --sanitize --library "target/$target/debug/libuqa_ffi.$suffix"
          python3 scripts/verify-c-xml-isolation.py --sanitize --library "target/$target/debug/libuqa_ffi.$suffix"
