name: C bindings

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]
  push:
    branches: [main]
  workflow_call:
    inputs:
      force_all:
        description: Validate every configuration for explicit full or release callers.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: c-bindings-${{ github.event.pull_request.number || github.ref }}
  # Only a completed replacement PR candidate supersedes the previous source.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}

env:
  RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  scope:
    name: Select C validation inputs
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.select.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Verify C validation selection
        run: |
          python3 -m unittest discover -s scripts/tests -p test_c_validation.py
          python3 -m unittest discover -s scripts/tests -p test_c_configurations.py
      - name: Inspect C validation inputs
        id: select
        env:
          C_VALIDATION_FORCE_ALL: ${{ inputs.force_all }}
        run: python3 scripts/c_validation.py --kind bindings

  consumers:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    name: C and C++ (${{ matrix.os }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os == 'macos-26-arm64' && fromJSON('["self-hosted","macOS","ARM64","macos-arm64","macos-26-arm64"]') || matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26-arm64]
        group: [core, duckdb]
    steps:
      - name: Limit shared macOS worker parallelism
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          printf '%s\n' 'CARGO_BUILD_JOBS=4' 'RUST_TEST_THREADS=4' 'NEXTEST_TEST_THREADS=4' \
            "RUSTUP_HOME=$RUNNER_TOOL_CACHE/rustup" "CARGO_HOME=$RUNNER_TOOL_CACHE/cargo" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TOOL_CACHE/cargo/bin"
          printf '%s\n' "$RUNNER_TOOL_CACHE/cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: c-${{ matrix.group }}
          cache-bin: false
          save-if: ${{ (runner.os != 'macOS' || runner.environment != 'self-hosted') && github.ref == 'refs/heads/main' }}
      - name: Execute every grouped configuration on all four storage providers
        run: python3 scripts/verify-c-configurations.py --group '${{ matrix.group }}'

  native-sanitizers:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    name: Native ASan (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-26-arm64' && fromJSON('["self-hosted","macOS","ARM64","macos-arm64","macos-26-arm64"]') || matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26-arm64]
    env:
      CC: ${{ github.workspace }}/.github/scripts/c-sanitizer-cc.sh
      CXX: clang++
      CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      RUSTFLAGS: -Zsanitizer=address -Zexternal-clangrt -Cforce-frame-pointers=yes -Cdefault-linker-libraries=yes -Clinker=clang -Clink-arg=-fsanitize=address,undefined
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Limit shared macOS worker parallelism
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          printf '%s\n' 'CARGO_BUILD_JOBS=4' 'RUST_TEST_THREADS=4' 'NEXTEST_TEST_THREADS=4' \
            "RUSTUP_HOME=$RUNNER_TOOL_CACHE/rustup" "CARGO_HOME=$RUNNER_TOOL_CACHE/cargo" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TOOL_CACHE/cargo/bin"
          printf '%s\n' "$RUNNER_TOOL_CACHE/cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Select the upstream Clang runtime on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # LLVM 22 supports C function-pointer checks on ARM64 and shares Rust's ASan ABI.
          if ! brew list --versions llvm@22 >/dev/null 2>&1; then
            brew install llvm@22
          fi
          llvm_bin="$(brew --prefix llvm@22)/bin"
          "$llvm_bin/clang" --version
          echo "$llvm_bin" >> "$GITHUB_PATH"
          echo 'MACOSX_DEPLOYMENT_TARGET=15.0' >> "$GITHUB_ENV"
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh
      - name: Verify shared Rust and native sanitizer linkage and diagnostics
        run: python3 scripts/verify-c-sanitizer-link.py
      - name: Instrument Rust, its standard library and native dependencies
        run: python3 scripts/verify-c-configurations.py --group sanitizers
