name: C bindings

on:
  pull_request:
    types: [ready_for_review]
  push:
    branches: [main]
  workflow_call:
    inputs:
      force_all:
        description: Validate every configuration for explicit full or release callers.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: c-bindings-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  scope:
    name: Select C validation inputs
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.select.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify C validation selection
        run: python3 -m unittest discover -s scripts/tests -p test_c_validation.py
      - name: Inspect C validation inputs
        id: select
        env:
          C_VALIDATION_FORCE_ALL: ${{ inputs.force_all }}
        run: python3 scripts/c_validation.py --kind bindings

  consumers:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    name: C and C++ (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        features:
          - minimal
          - default
          - arrow
          - duckdb
          - arrow,duckdb
          - arrow-export
          - arrow-export,arrow
          - arrow-export,duckdb
          - arrow-export,arrow,duckdb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: c-${{ matrix.features }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Execute C ABI clients on all four storage providers
        shell: bash
        run: |
          args=(--features test-support)
          if [[ '${{ matrix.features }}' != default ]]; then
            args+=(--no-default-features)
          fi
          if [[ '${{ matrix.features }}' != minimal && '${{ matrix.features }}' != default ]]; then
            args+=(--features '${{ matrix.features }}')
          fi
          cargo build -p uqa-ffi --locked --profile test "${args[@]}"
          cargo test -p uqa-ffi --locked --lib "${args[@]}"
          if [[ '${{ matrix.features }}' == minimal ]]; then
            cargo test -p uqa-storage --locked --features test-support --lib test_support::tests
          fi
          suffix=so
          if [[ "$RUNNER_OS" == macOS ]]; then suffix=dylib; fi
          python3 scripts/verify-c-clients.py --library "target/debug/libuqa.$suffix"
      - name: Execute five public examples as C11 and C++17
        shell: bash
        run: |
          suffix=so
          if [[ "$RUNNER_OS" == macOS ]]; then suffix=dylib; fi
          python3 scripts/verify-c-examples.py --library "target/debug/libuqa.$suffix"
          python3 scripts/verify-c-xml-isolation.py --library "target/debug/libuqa.$suffix"
      - name: Instrument the example consumers with ASan and UBSan
        shell: bash
        run: |
          suffix=so
          if [[ "$RUNNER_OS" == macOS ]]; then suffix=dylib; fi
          python3 scripts/verify-c-examples.py --sanitize --library "target/debug/libuqa.$suffix"
          python3 scripts/verify-c-clients.py --sanitize --library "target/debug/libuqa.$suffix"

  native-sanitizers:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    name: Native ASan (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        features: [minimal, arrow-export]
    env:
      CC: ${{ github.workspace }}/.github/scripts/c-sanitizer-cc.sh
      CXX: clang++
      CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      RUSTFLAGS: -Zsanitizer=address -Zexternal-clangrt -Cforce-frame-pointers=yes -Cdefault-linker-libraries=yes -Clinker=clang -Clink-arg=-fsanitize=address,undefined
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Select the upstream Clang runtime on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # LLVM 22 supports C function-pointer checks on ARM64 and shares Rust's ASan ABI.
          if ! brew list --versions llvm@22 >/dev/null 2>&1; then
            brew install llvm@22
          fi
          llvm_bin="$(brew --prefix llvm@22)/bin"
          "$llvm_bin/clang" --version
          echo "$llvm_bin" >> "$GITHUB_PATH"
          echo 'MACOSX_DEPLOYMENT_TARGET=15.0' >> "$GITHUB_ENV"
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh
      - name: Verify shared Rust and native sanitizer linkage and diagnostics
        run: python3 scripts/verify-c-sanitizer-link.py
      - name: Instrument Rust, its standard library and native dependencies
        shell: bash
        run: |
          target=$(rustc +nightly -vV | sed -n 's/^host: //p')
          args=(--no-default-features --features test-support)
          if [[ '${{ matrix.features }}' != minimal ]]; then
            args+=(--features '${{ matrix.features }}')
          fi
          cargo +nightly build --locked -Zbuild-std --target "$target" --profile test -p uqa-ffi "${args[@]}"
          cargo +nightly test --locked -Zbuild-std --target "$target" -p uqa-ffi --lib "${args[@]}"
          suffix=so
          if [[ "$RUNNER_OS" == macOS ]]; then suffix=dylib; fi
          python3 scripts/verify-c-clients.py --sanitize --library "target/$target/debug/libuqa.$suffix"
          python3 scripts/verify-c-examples.py --sanitize --library "target/$target/debug/libuqa.$suffix"
          python3 scripts/verify-c-xml-isolation.py --sanitize --library "target/$target/debug/libuqa.$suffix"
