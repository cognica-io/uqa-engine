name: Foreign handler features

on:
  pull_request:
    paths:
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/fdw-features.yml
      - scripts/check-fdw-feature-isolation.py
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-fdw-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_DEV_OPT_LEVEL: "2"
  CARGO_PROFILE_TEST_OPT_LEVEL: "2"

jobs:
  features:
    name: FDW features (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    env:
      RUSTFLAGS: ${{ matrix.os == 'ubuntu-24.04' && '-D warnings -C linker-features=-lld' || '-D warnings' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fetch --locked
      - name: Verify native, development and browser dependency isolation
        run: python3 scripts/check-fdw-feature-isolation.py
      - name: Test foreign catalogs without source handlers
        run: |
          cargo test -p uqa-engine --no-default-features --locked --lib catalog::foreign_tables
          cargo test -p uqa-engine --no-default-features --locked --test integration sql_foreign_ddl
          cargo test -p uqa-engine --no-default-features --locked --test integration manual_sql_examples_compile_or_execute
          cargo test -p uqa-cli --no-default-features --locked --test integration
      - name: Test memory and Arrow handlers
        run: |
          cargo test -p uqa-fdw --locked
          cargo test -p uqa-engine --no-default-features --features fdw --locked --lib catalog::foreign_tables
          cargo test -p uqa-engine --no-default-features --features fdw --locked --test integration sql_foreign_ddl
          cargo test -p uqa-engine --no-default-features --features fdw --locked --test integration foreign_table_ownership
          cargo test -p uqa-engine --no-default-features --features fdw --locked --test integration catalog::sql_rules::relation_dependencies
      - name: Test explicitly selected DuckDB
        run: |
          cargo test -p uqa-fdw --features duckdb --locked
          cargo test -p uqa-engine --no-default-features --features duckdb --locked duckdb
      - name: Check enabled handlers and benchmark targets
        run: cargo clippy -p uqa-engine -p uqa-fdw -p uqa-cli --all-targets --no-default-features --features uqa-engine/duckdb,uqa-cli/duckdb,uqa-fdw/duckdb --locked -- -D warnings
