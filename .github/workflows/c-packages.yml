name: C packages

on:
  pull_request:
    types: [ready_for_review]
  push:
    branches: [main]
  workflow_call:
    inputs:
      force_all:
        description: Validate every configuration for explicit full or release callers.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: c-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  scope:
    name: Select C validation inputs
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.select.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify C validation selection
        run: python3 -m unittest discover -s scripts/tests -p test_c_validation.py
      - name: Inspect C validation inputs
        id: select
        env:
          C_VALIDATION_FORCE_ALL: ${{ inputs.force_all }}
        run: python3 scripts/c_validation.py --kind packages

  package:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    name: C package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: c-distribution
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and install the C distribution
        # Native Perl must remain ahead of Git Bash for Windows dependencies.
        run: python scripts/build-c-bindings.py --target '${{ matrix.target }}' --profile release --prefix '${{ runner.temp }}/uqa-c-package/installed' --build-directory '${{ runner.temp }}/uqa-c-package/build'
      - name: Install native Windows pkgconf
        if: runner.os == 'Windows'
        id: pkgconf
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-pkgconf
      - name: Verify native package tooling
        env:
          PKG_CONFIG: ${{ runner.os == 'Windows' && format('{0}/mingw64/bin/pkgconf.exe', steps.pkgconf.outputs.msys2-location) || 'pkg-config' }}
        run: python -m unittest discover -s scripts/tests -p test_c_bindings_package.py
      - name: Relocate and qualify installed C and C++ consumers
        env:
          PKG_CONFIG: ${{ runner.os == 'Windows' && format('{0}/mingw64/bin/pkgconf.exe', steps.pkgconf.outputs.msys2-location) || 'pkg-config' }}
        run: |
          python -c 'import os; from pathlib import Path; work = Path(os.environ["RUNNER_TEMP"]) / "uqa-c-package"; (work / "installed").rename(work / "relocated C package")'
          python scripts/verify-c-package.py --prefix '${{ runner.temp }}/uqa-c-package/relocated C package'
      - name: Qualify native allocator failures and panic cleanup
        run: |
          cargo test --locked --release --target '${{ matrix.target }}' -p uqa-ffi --features test-support --lib
      - name: Archive the qualified native package
        shell: bash
        run: |
          shopt -s nullglob
          python scripts/c-bindings-release.py package --target '${{ matrix.target }}' --prefix '${{ runner.temp }}/uqa-c-package/relocated C package' --directory dist/c
          archives=(dist/c/uqa-c-*.tgz dist/c/uqa-c-*.zip)
          python scripts/check-release-licenses.py --require-nori --require-kuromoji "${archives[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: c-bindings-${{ matrix.target }}
          path: dist/c/*
          if-no-files-found: error
      - name: Retain native build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: c-bindings-diagnostics-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/uqa-c-package/build/native-build.log
            ${{ runner.temp }}/uqa-c-package/build/cmake/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
