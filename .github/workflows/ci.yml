name: Pre-merge CI

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/*/Cargo.toml"
      - "examples/rust/*/Cargo.toml"
      - rust-toolchain.toml
      - ".cargo/**"
      - .github/workflows/ci.yml
  workflow_dispatch:
    inputs:
      run_rust:
        description: Run the Rust validation jobs for a Rust-affecting change
        required: true
        type: boolean
      run_transactions:
        description: Run concurrent transaction owner and public API acceptance without measurements
        required: false
        default: false
        type: boolean
      transaction_platform:
        description: Select the transaction runner to verify an affected platform independently
        required: false
        default: all
        type: choice
        options:
          - all
          - ubuntu-24.04
          - macos-14
          - windows-latest
      transaction_suite:
        description: Select all transaction histories or retained resource owners and consumers
        required: false
        default: all
        type: choice
        options:
          - all
          - retained-resources
      run_nori_allocations:
        description: Run only persistent Nori allocation and output checks when run_rust is false
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.run_transactions && inputs.transaction_platform || 'default' }}-${{ inputs.run_transactions && inputs.transaction_suite || 'default' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  test-linux:
    name: test Linux
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_rust) }}
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-D warnings -C linker-features=-lld"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Validate manual SQL examples
        run: cargo test -p uqa-engine --test integration --locked queries::manual_sql_examples::manual_sql_examples_compile_or_execute -- --exact
      - name: Test workspace
        run: cargo test --workspace --exclude uqa-fdw --locked -- --skip manual_sql_examples::manual_sql_examples_compile_or_execute
      - name: Test morphology bundle tools and embedded models
        run: cargo test -p uqa-analysis -p uqa-nori-data -p uqa-kuromoji-data --features uqa-analysis/nori-tools,uqa-analysis/kuromoji-tools --locked
      - name: Verify independent analyzer features
        run: |
          cargo test -p uqa-analysis --features kuromoji-tools --no-default-features --locked
          cargo test -p uqa-storage -p uqa-storage-sqlite -p uqa-storage-redb -p uqa-scoring -p uqa-operators --features uqa-analysis/kuromoji --locked japanese_
          cargo test -p uqa-engine --features kuromoji --test integration --locked kuromoji_
          cargo test -p uqa-engine --no-default-features --test integration --locked kuromoji_
          cargo test -p uqa-cli --features kuromoji --test integration --locked builtin_
          python3 scripts/check-analyzer-feature-isolation.py
      - name: Verify the standalone CLI without morphology dictionaries
        run: |
          cargo test -p uqa-cli --locked --no-default-features --test integration
          cargo tree --locked -p uqa-cli --no-default-features --edges normal > target/cli-without-morphology.txt
          if grep -Eq 'uqa-(nori|kuromoji)-data' target/cli-without-morphology.txt; then
            echo "Morphology dictionary present in the feature-disabled CLI" >&2
            exit 1
          fi

  test-fdw-linux:
    name: test FDW Linux
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_rust) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p uqa-fdw --locked

  test-macos:
    name: test macOS
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_rust) }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked
      - name: Test morphology bundle tools and embedded models
        run: cargo test -p uqa-analysis -p uqa-nori-data -p uqa-kuromoji-data --features uqa-analysis/nori-tools,uqa-analysis/kuromoji-tools --locked

  clippy:
    name: clippy ${{ matrix.label }}
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_rust) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-24.04
          - label: macOS
            os: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint morphology bundle tools and data
        run: cargo clippy -p uqa-analysis -p uqa-nori-data -p uqa-kuromoji-data --features uqa-analysis/nori-tools,uqa-analysis/kuromoji-tools --all-targets --locked -- -D warnings

  msrv:
    name: check Rust 1.90
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_rust) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Free Linux runner disk
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --locked
      - run: cargo check -p uqa-analysis --features nori-tools,kuromoji-tools --all-targets --locked

  doc:
    name: doc
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_rust) }}
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --locked

  deny:
    name: deny
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_rust) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace

  upstream-regression-oracle:
    name: PostgreSQL upstream regression oracle
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_rust) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Test upstream corpus accounting and failure detection
        run: python3 -m unittest discover -s scripts/tests -p 'test_pg18_upstream_harness.py'
      - name: Build pinned PostgreSQL regression environment
        timeout-minutes: 10
        run: python3 tests/parity/pg18/upstream/harness.py build
      - name: Run every official core and isolation test
        timeout-minutes: 17
        run: python3 tests/parity/pg18/upstream/harness.py run --output target/pg18-upstream/reference --timeout 300
      - uses: actions/upload-artifact@v4
        timeout-minutes: 2
        if: always()
        with:
          name: pg18-upstream-reference-${{ github.sha }}
          path: target/pg18-upstream/reference/

  nori-reference:
    name: Lucene dictionaries and reference regeneration
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_rust) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: target/nori-reference-cache
          key: nori-reference-${{ hashFiles('tests/parity/nori/manifest.json', 'tests/parity/nori/csv_manifest.json', 'tests/parity/cjk_width/manifest.json', 'tests/parity/kuromoji/manifest.json', 'tests/parity/kuromoji/csv_manifest.json') }}
      - name: Rebuild exact dictionary resources from the pinned CSV source
        run: python3 tests/parity/nori/regenerate_dictionary.py --platform linux/amd64 --cache-dir target/nori-reference-cache --output target/nori-csv-regeneration
      - name: Reproduce every neutral model value and reference fixture with Docker
        run: |
          set -euo pipefail
          python3 tests/parity/nori/export_model.py --platform linux/amd64 --offline --cache-dir target/nori-reference-cache --output target/nori-reference-model
          for driver in run_reference.py run_user_reference.py run_tokenizer_reference.py run_analysis_reference.py run_number_reference.py run_generic_reference.py; do
            python3 "tests/parity/nori/$driver" --platform linux/amd64 --offline --cache-dir target/nori-reference-cache
          done
      - name: Verify complete CJK width text and offset identities with Docker
        run: python3 tests/parity/cjk_width/run_reference.py --platform linux/amd64 --cache-dir target/nori-reference-cache
      - name: Rebuild patched IPADIC and reproduce every Japanese model value with Docker
        run: |
          set -euo pipefail
          python3 tests/parity/kuromoji/regenerate_dictionary.py --platform linux/amd64 --cache-dir target/nori-reference-cache --output target/kuromoji-csv-regeneration
          python3 tests/parity/kuromoji/export_model.py --platform linux/amd64 --offline --cache-dir target/nori-reference-cache --output target/kuromoji-reference-model
          python3 tests/parity/kuromoji/export_model.py --platform linux/amd64 --offline --cache-dir target/nori-reference-cache --output target/kuromoji-reference-model --verify-only
          python3 tests/parity/kuromoji/run_user_reference.py --platform linux/amd64 --offline --cache-dir target/nori-reference-cache
          python3 tests/parity/kuromoji/run_tokenizer_reference.py --platform linux/amd64 --offline --cache-dir target/nori-reference-cache
          python3 tests/parity/kuromoji/run_nbest_reference.py --platform linux/amd64 --offline --cache-dir target/nori-reference-cache
          python3 tests/parity/kuromoji/run_filter_reference.py --platform linux/amd64 --offline --cache-dir target/nori-reference-cache
          python3 tests/parity/kuromoji/run_number_reference.py --platform linux/amd64 --offline --cache-dir target/nori-reference-cache
          python3 tests/parity/kuromoji/run_completion_reference.py --platform linux/amd64 --offline --cache-dir target/nori-reference-cache
          python3 tests/parity/kuromoji/run_iteration_reference.py --platform linux/amd64 --offline --cache-dir target/nori-reference-cache
      - uses: actions/upload-artifact@v4
        with:
          name: nori-reference-${{ github.sha }}
          path: |
            target/nori-csv-regeneration/regeneration_manifest.json
            target/nori-reference-model/model_manifest.json
            target/kuromoji-csv-regeneration/regeneration_manifest.json
            target/kuromoji-reference-model/model_manifest.json

  nori-benchmark:
    name: Nori native analysis and indexing gate
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.run_rust || inputs.run_nori_allocations)) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Measure native analysis and indexing with reviewed allocation ceilings
        if: ${{ github.event_name == 'push' || inputs.run_rust }}
        run: |
          mkdir -p target/benchmark-runs
          python3 scripts/run-nori-benchmark.py --output target/benchmark-runs/nori-native.json
          python3 scripts/run-nori-index-benchmark.py --output target/benchmark-runs/nori-index-native.json
          python3 scripts/run-nori-phrase-benchmark.py --output target/benchmark-runs/nori-phrase-native.json
      - name: Verify SQLite allocation and reopened outputs
        if: ${{ !cancelled() }}
        run: python3 scripts/run-nori-persistent-benchmark.py --provider sqlite --output target/benchmark-runs/nori-sqlite-native.json --allocation-only
      - name: Verify redb allocation and reopened outputs
        if: ${{ !cancelled() }}
        run: python3 scripts/run-nori-persistent-benchmark.py --provider redb --output target/benchmark-runs/nori-redb-native.json --allocation-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nori-native-${{ github.sha }}
          path: |
            target/benchmark-runs/nori-native.json
            target/benchmark-runs/nori-index-native.json
            target/benchmark-runs/nori-sqlite-native.json
            target/benchmark-runs/nori-redb-native.json
            target/benchmark-runs/nori-phrase-native.json

  gate:
    name: pre-merge CI
    if: ${{ always() }}
    needs: [test-linux, test-fdw-linux, test-macos, clippy, msrv, doc, deny, upstream-regression-oracle, nori-reference, nori-benchmark, concurrent-transactions]
    runs-on: ubuntu-24.04
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Require every selected job to pass
        run: |
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac

  concurrent-transactions:
    name: concurrent transactions ${{ matrix.os }} (${{ inputs.transaction_suite }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_transactions }}
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.os == 'ubuntu-24.04' && '-D warnings -C linker-features=-lld' || '-D warnings' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.transaction_platform == 'all' && '["ubuntu-24.04","macos-14","windows-latest"]' || format('["{0}"]', inputs.transaction_platform)) }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint transaction owners and consumers
        run: >-
          cargo clippy --locked
          -p uqa-core -p uqa-sql -p uqa-storage -p uqa-storage-sqlite -p uqa-storage-redb
          -p uqa-execution -p uqa-engine -p uqa-pg-server
          --lib --tests --features uqa-engine/nori,uqa-engine/kuromoji
          -- -D warnings
      - name: Verify retained owners and actual provider histories
        run: >-
          cargo test --locked --no-fail-fast
          -p uqa-core -p uqa-sql -p uqa-storage -p uqa-storage-sqlite -p uqa-storage-redb
          -p uqa-execution -p uqa-engine -p uqa-pg-server
          --lib --tests --features uqa-engine/nori,uqa-engine/kuromoji --
          memory:: types::value:: types::array:: types::decimal:: types::jsonb:: types::temporal:: types::tests:: json::tests float_text::
          expr:: type_resolution:: schema::retention:: schema::generated:: assignment:: scalar::
          document_store:: inverted_index:: key_value::tests::index_retention::
          mvcc:: mvcc_sessions:: analyzer_bindings:: analyzer_revisions:: occurrences:: field_metadata:: japanese::
          temporary_file:: vector_index::collection:: compound:: logical_sessions:: restore::
          query::generated:: query::table_snapshot:: query::document_changes:: serializable::
          spill:: spill_scan:: external_sort:: distinct:: join:: aggregation:: temporary_database::
          mutation::conflict:: row_locks::retry_cache:: storage_errors::tests::
          tests::storage_consistency:: table_storage::documents::tests::
          transactions::tests::mutation_failures:: state::catalog_cell::tests::
          storage::sessions::commit_resolution::
          session::analyze::
          sql_generated_columns:: queries::sql_cursor::secure_temporary:: concurrent_transactions::
          ${{ inputs.transaction_suite == 'all' && 'transaction_lifecycle::pg18_cursors:: sessions::concurrent_writes:: sessions::native_publication:: redb_backend:: sqlite_key_value_backend:: storage::transaction_lifecycle::pg18_isolation:: storage::sessions::serializable_observations:: storage::sessions::concurrent_inserts::' || '' }}
          --skip snapshot_creation_does_not_scale_with_document_count
          --skip mvcc::process_writer_helper
          --skip storage::sessions::concurrent_inserts::processes::insert_worker
          2>&1 | tee target/concurrent-transactions.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concurrent-transactions-${{ matrix.os }}-${{ inputs.transaction_suite }}-${{ github.sha }}
          path: target/concurrent-transactions.log
          if-no-files-found: ignore
