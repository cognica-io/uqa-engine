name: Pre-merge CI

on:
  workflow_dispatch:
    inputs:
      run_rust:
        description: Run the Rust validation jobs for a Rust-affecting change
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  test-linux:
    name: test Linux
    if: ${{ inputs.run_rust }}
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-D warnings -C linker-features=-lld"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: true
      - name: Validate manual SQL examples
        run: cargo test -p uqa-engine --test integration --locked engine_queries::manual_sql_examples::manual_sql_examples_compile_or_execute -- --exact
      - name: Test workspace
        run: cargo test --workspace --exclude uqa-fdw --locked -- --skip manual_sql_examples::manual_sql_examples_compile_or_execute

  test-fdw-linux:
    name: test FDW Linux
    if: ${{ inputs.run_rust }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: true
      - run: cargo test -p uqa-fdw --locked

  test-macos:
    name: test macOS
    if: ${{ inputs.run_rust }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: true
      - run: cargo test --workspace --locked

  clippy:
    name: clippy ${{ matrix.label }}
    if: ${{ inputs.run_rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-24.04
          - label: macOS
            os: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: true
      - run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: check Rust 1.90
    if: ${{ inputs.run_rust }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Free Linux runner disk
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: true
      - run: cargo check --workspace --locked

  doc:
    name: doc
    if: ${{ inputs.run_rust }}
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: true
      - run: cargo doc --workspace --no-deps --locked

  deny:
    name: deny
    if: ${{ inputs.run_rust }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace

  gate:
    name: pre-merge CI
    if: ${{ always() }}
    needs: [test-linux, test-fdw-linux, test-macos, clippy, msrv, doc, deny]
    runs-on: ubuntu-24.04
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Require every selected job to pass
        run: |
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
