name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Full debuginfo for every workspace test binary exhausts the Ubuntu runner's
  # disk during broad workspace builds. CI only needs build and test output,
  # not local debugging sections.
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_BENCH_DEBUG: "0"
  # Keep CI artifacts compact; incremental state is useful locally but bloats
  # GitHub-hosted runners during workspace-wide test / bench builds.
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check public repository hygiene
        run: bash scripts/check-public-repository-hygiene.sh
      - name: Check Rust file headers
        run: bash scripts/check-rust-file-headers.sh
      - name: Check Rust file line limit
        run: bash scripts/check-rust-file-lines.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check workspace dependency policy
        run: python3 scripts/check-workspace-dependencies.py
      - name: Check benchmark coverage
        run: python3 scripts/check-benchmark-coverage.py
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: ${{ runner.os != 'Linux' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ${{ matrix.os }}
    env:
      # The Ubuntu runner hit an lld bus-error while linking a test binary, so
      # use the system linker there while keeping warnings-as-errors.
      RUSTFLAGS: ${{ matrix.os == 'ubuntu-24.04' && '-D warnings -C linker-features=-lld' || '-D warnings' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        if: runner.os != 'Linux'
        with:
          cache-bin: false
          cache-targets: true
      - name: Test uqa-fdw on Linux
        if: runner.os == 'Linux'
        run: cargo test -p uqa-fdw --locked
      - name: Clear FDW test artifacts on Linux
        if: runner.os == 'Linux'
        run: cargo clean
      - name: Test workspace on Linux
        if: runner.os == 'Linux'
        run: cargo test --workspace --exclude uqa-fdw --locked
      - name: Test workspace on macOS
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked

  example-build:
    name: cargo build --examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: false
      - run: cargo build -p uqa-engine --examples --locked

  build-release:
    name: cargo build --release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: ${{ runner.os != 'Linux' }}
      - run: cargo build --workspace --release --locked

  doc:
    name: cargo doc
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: false
      - run: cargo doc --workspace --no-deps --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace

  bench-build:
    name: cargo bench --no-run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: false
      - run: cargo bench --workspace --no-run --locked

  analytical-benchmark:
    name: analytical comparison gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: false
      - name: Run UQA, SQLite, and DuckDB comparison
        run: bash scripts/run-analytical-comparison.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytical-comparison-${{ github.sha }}
          path: |
            target/benchmark-runs/analytical-comparison.json
            target/criterion/analytical_external_q1/*/new/estimates.json
            target/criterion/analytical_external_q6/*/new/estimates.json
            target/criterion/analytical_result_scan/*/new/estimates.json
