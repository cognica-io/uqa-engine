name: Python Wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/python-wheels.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/uqa-*/**"
      - "pyproject.toml"
      - "python/**"
      - "tests/python/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  build-wheels:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - label: linux aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
          - label: macos x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto
          - label: macos aarch64
            os: macos-14
            target: aarch64-apple-darwin
            manylinux: auto
          - label: windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
          - label: windows aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            manylinux: auto

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: false

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.11.5
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist

      - name: Smoke test wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python - <<'PY'
          import uqa

          engine = uqa.Engine()
          result = engine.sql("SELECT 1 AS n")
          assert result.rows == [{"n": 1}], result.rows
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          maturin-version: v1.11.5
          args: --locked --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
