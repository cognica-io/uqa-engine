name: Python Wheels

on:
  workflow_dispatch:
  # Tag builds are driven by release.yml, which calls this workflow and then
  # attaches the artifacts it uploads to the GitHub release. Keeping the tag
  # trigger here as well would build every wheel twice for the same tag.
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/python-wheels.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE"
      - "LICENSES/**"
      - "LICENSING.md"
      - "crates/uqa-*/**"
      - "examples/python/**"
      - "pyproject.toml"
      - "python/**"
      - "scripts/check-release-licenses.py"
      - "tests/python/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # LLVM optimization of the single-codegen-unit release artifact needs the 64 MiB worker stack rustc recommends on Linux aarch64.
  RUST_MIN_STACK: "67108864"
  RUSTFLAGS: "-D warnings"

jobs:
  build-wheels:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - label: linux aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - label: macos x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto
          - label: macos aarch64
            os: macos-14
            target: aarch64-apple-darwin
            manylinux: auto
          - label: windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
          - label: windows aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            manylinux: auto

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: false

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.11.5
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: source .github/scripts/install-manylinux-build-deps.sh
          args: --release --locked --compatibility pypi --out dist

      - name: Check wheel license contents
        shell: bash
        run: python scripts/check-release-licenses.py dist/*.whl

      # `requires-python = ">=3.8"` only holds because pyo3 is built against
      # the CPython stable ABI. Dropping the abi3 feature would silently
      # produce version-specific wheels and make that claim wrong, so the tag
      # is asserted rather than assumed.
      - name: Assert the wheel targets the stable ABI
        shell: bash
        run: |
          set -euo pipefail
          for wheel in dist/*.whl; do
            case "$(basename "$wheel")" in
              *-cp38-abi3-*) ;;
              *)
                echo "::error::$(basename "$wheel") is not a cp38-abi3 wheel;" \
                     "requires-python >=3.8 would no longer be true" >&2
                exit 1
                ;;
            esac
          done

      - name: Test wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest dist/*.whl
          python - <<'PY'
          import uqa

          engine = uqa.Engine()
          result = engine.sql("SELECT 1 AS n")
          assert result.rows == [{"n": 1}], result.rows
          PY
          python -m pytest -q tests/python
          for example in examples/python/*.py; do
            python "$example"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          maturin-version: v1.11.5
          args: --out dist

      - name: Check sdist license contents
        run: python scripts/check-release-licenses.py dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  minimum-python:
    name: minimum supported python
    needs: build-wheels
    runs-on: ubuntu-24.04
    # The declared floor is 3.8, which is past end of life and not available
    # from the runner tool cache. A container pins the exact interpreter, and
    # bookworm's glibc satisfies the manylinux_2_28 wheel.
    container: python:3.8-slim-bookworm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-wheel-x86_64-unknown-linux-gnu
          path: dist

      - name: Install and exercise the wheel on the declared minimum
        shell: bash
        run: |
          set -euo pipefail
          python --version
          pip install --quiet --no-cache-dir dist/*.whl
          python - <<'PY'
          import sys

          import uqa

          print("python:", sys.version.split()[0])
          engine = uqa.Engine()
          assert engine.sql("SELECT 1 AS n").rows == [{"n": 1}]
          engine.sql("CREATE TABLE t (id INTEGER PRIMARY KEY, body TEXT)")
          engine.sql("CREATE INDEX t_body_gin ON t USING gin (body)")
          engine.sql("INSERT INTO t (id, body) VALUES (1, 'retrieval ranking')")
          hits = engine.sql("SELECT id FROM t WHERE text_match(body, 'retrieval')")
          assert hits.rows == [{"id": 1}], hits.rows
          PY
