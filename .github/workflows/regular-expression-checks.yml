name: Regular expression WASM checks

on:
  pull_request:
    paths:
      - ".github/actions/select-validation-inputs/**"
      - "scripts/performance_change_scope.py"
      - "scripts/tests/test_performance_change_scope.py"
      - "crates/uqa-pg-regex/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/emscripten-flags.py"
      - ".github/workflows/regular-expression-checks.yml"
  push:
    branches: [main]
    paths:
      - ".github/actions/select-validation-inputs/**"
      - "scripts/performance_change_scope.py"
      - "scripts/tests/test_performance_change_scope.py"
      - "crates/uqa-pg-regex/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/emscripten-flags.py"
      - ".github/workflows/regular-expression-checks.yml"

permissions:
  contents: read

jobs:
  scope:
    name: Select regex inputs
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.select.outputs.required }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: select
        uses: ./.github/actions/select-validation-inputs
        with:
          kind: regex
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          before: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
  wasm:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    name: Emscripten frame and memory bounds (Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.rust }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.90.0", "1.95.0"]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings -C link-arg=-sALLOW_MEMORY_GROWTH=1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.3"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-emscripten
      - name: Match C longjmp to the Rust unwind ABI
        run: |
          emscripten_flags="$(python3 scripts/emscripten-flags.py)"
          echo "CFLAGS_wasm32_unknown_emscripten=${emscripten_flags}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: regex-emscripten
      - name: Verify baseline V8 tier
        env:
          CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUNNER: "node --liftoff --no-wasm-tier-up"
        run: cargo test --locked --release -p uqa-pg-regex --target wasm32-unknown-emscripten
      - name: Verify optimizing V8 tier using the same test binaries
        env:
          CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUNNER: "node --no-liftoff"
        run: cargo test --locked --release -p uqa-pg-regex --target wasm32-unknown-emscripten
