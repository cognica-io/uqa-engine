name: Publish Python to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish, for example v0.1.6
        required: true
        type: string
      publish_sdist:
        description: Publish the source distribution to PyPI; GitHub always retains it
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pypi-uqa
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare uqa distributions
    runs-on: ubuntu-24.04
    outputs:
      digests: ${{ steps.inventory.outputs.digests }}
      publish: ${{ steps.pypi.outputs.publish }}
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      PUBLISH_SDIST: ${{ inputs.publish_sdist }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate the release version
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "invalid release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          project_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)"
          if [ "$RELEASE_TAG" != "v$project_version" ]; then
            echo "release tag $RELEASE_TAG does not match Python project version $project_version" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json isDraft --jq 'select(.isDraft == false) | true' | grep -qx true

      - name: Download the released Python distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --dir dist \
            --pattern 'uqa-*.whl' \
            --pattern 'uqa-*.tar.gz'

      - name: Verify the Python release inventory
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          expected=(
            "uqa-${version}.tar.gz"
            "uqa-${version}-cp38-abi3-macosx_10_12_x86_64.whl"
            "uqa-${version}-cp38-abi3-macosx_11_0_arm64.whl"
            "uqa-${version}-cp38-abi3-manylinux_2_28_aarch64.whl"
            "uqa-${version}-cp38-abi3-manylinux_2_28_x86_64.whl"
            "uqa-${version}-cp38-abi3-win_amd64.whl"
            "uqa-${version}-cp38-abi3-win_arm64.whl"
          )
          shopt -s nullglob
          actual=(dist/*)
          if [ "${#actual[@]}" -ne "${#expected[@]}" ]; then
            echo "expected ${#expected[@]} Python distributions, found ${#actual[@]}" >&2
            printf '%s\n' "${actual[@]}" >&2
            exit 1
          fi
          for filename in "${expected[@]}"; do
            if [ ! -f "dist/$filename" ]; then
              echo "missing Python distribution: $filename" >&2
              exit 1
            fi
          done
          digest_file="$RUNNER_TEMP/release-asset-digests.tsv"
          gh release view "$RELEASE_TAG" \
            --json assets \
            --jq '.assets[] | [.name, .digest] | @tsv' > "$digest_file"
          for filename in "${expected[@]}"; do
            asset_digest="$(awk -F '\t' -v filename="$filename" \
              '$1 == filename { print $2 }' "$digest_file")"
            if [[ ! "$asset_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "missing or invalid GitHub Release digest for $filename" >&2
              exit 1
            fi
            local_digest="sha256:$(sha256sum "dist/$filename" | awk '{print $1}')"
            if [ "$local_digest" != "$asset_digest" ]; then
              echo "GitHub Release digest mismatch for $filename" >&2
              echo "expected: $asset_digest" >&2
              echo "actual:   $local_digest" >&2
              exit 1
            fi
          done
          python3 scripts/check-release-licenses.py --require-nori "${actual[@]}"

      - name: Select Python distributions for PyPI
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test -f "dist/uqa-${version}.tar.gz"
          case "$PUBLISH_SDIST" in
            true) ;;
            false) rm "dist/uqa-${version}.tar.gz" ;;
            *) echo "invalid source publication choice: $PUBLISH_SDIST" >&2; exit 1 ;;
          esac
          {
            echo 'digests<<UQA_RELEASE_DIGESTS'
            (
              cd dist
              sha256sum -- *
            )
            echo UQA_RELEASE_DIGESTS
          } >> "$GITHUB_OUTPUT"

      - name: Check whether PyPI already has this exact release
        id: pypi
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          python3 - "$version" "$GITHUB_OUTPUT" <<'PY'
          import hashlib
          import json
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          version, output_path = sys.argv[1:]

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          local = {path.name: sha256(path) for path in sorted(Path("dist").iterdir())}
          request = urllib.request.Request(
              f"https://pypi.org/pypi/uqa/{version}/json",
              headers={"User-Agent": "uqa-engine-pypi-workflow"},
          )
          try:
              with urllib.request.urlopen(request) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              with open(output_path, "a", encoding="utf-8") as output:
                  output.write("publish=true\n")
              raise SystemExit(0)

          remote = {}
          for item in payload.get("urls", []):
              filename = item.get("filename")
              digest = (item.get("digests") or {}).get("sha256")
              if not filename or not digest or filename in remote:
                  raise SystemExit("PyPI returned an invalid release inventory")
              remote[filename] = digest
          if remote != local:
              missing = sorted(set(local) - set(remote))
              unexpected = sorted(set(remote) - set(local))
              mismatched = sorted(
                  filename
                  for filename in set(local) & set(remote)
                  if local[filename] != remote[filename]
              )
              raise SystemExit(
                  "PyPI already has a different release inventory: "
                  f"missing={missing}, unexpected={unexpected}, mismatched={mismatched}"
              )
          print(f"PyPI already has the verified uqa {version} distributions; skipping upload")
          with open(output_path, "a", encoding="utf-8") as output:
              output.write("publish=false\n")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.pypi.outputs.publish == 'true' }}
        with:
          name: python-pypi-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: publish uqa
    needs: prepare
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/uqa
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-pypi-distributions
          path: dist/

      - name: Verify the transferred release files
        shell: bash
        working-directory: dist
        env:
          RELEASE_DIGESTS: ${{ needs.prepare.outputs.digests }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path

          expected = {}
          for line in os.environ["RELEASE_DIGESTS"].splitlines():
              digest, filename = line.split("  ", 1)
              expected[filename] = digest
          actual = {path.name for path in Path(".").iterdir()}
          if not expected or actual != set(expected):
              raise SystemExit(
                  "Transferred release inventory differs from verified files: "
                  f"missing={sorted(set(expected) - actual)}, "
                  f"unexpected={sorted(actual - set(expected))}"
              )
          for filename, digest in expected.items():
              actual_digest = hashlib.sha256()
              with Path(filename).open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      actual_digest.update(chunk)
              if actual_digest.hexdigest() != digest:
                  raise SystemExit(f"Transferred release digest mismatch: {filename}")
          print(f"Verified all {len(expected)} transferred release files")
          PYTHON

      - name: Publish the Python distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true

  record:
    name: record PyPI publication
    needs: [prepare, publish]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    concurrency:
      group: registry-release-notes-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      PUBLISH_SDIST: ${{ inputs.publish_sdist }}
    steps:
      - name: Update the GitHub release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes_file"
          python3 - "$notes_file" "$version" <<'PY'
          import os
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          version = sys.argv[2]
          status = (
              f"PyPI status: Published as [`uqa=={version}`]"
              f"(https://pypi.org/project/uqa/{version}/)."
          )
          if os.environ["PUBLISH_SDIST"] == "false":
              source_url = (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/"
                  f"download/v{version}/uqa-{version}.tar.gz"
              )
              status = (
                  f"PyPI status: Published all six wheels as [`uqa=={version}`]"
                  f"(https://pypi.org/project/uqa/{version}/). "
                  f"The verified source distribution is provided through "
                  f"[GitHub Release]({source_url}) only, as explicitly selected for this release."
              )
          lines = path.read_text(encoding="utf-8").splitlines()
          replaced = False
          for index, line in enumerate(lines):
              if line.startswith("PyPI status:"):
                  lines[index] = status
                  replaced = True
          if not replaced:
              lines.extend(["", "## PyPI", "", status])
          path.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes_file"
