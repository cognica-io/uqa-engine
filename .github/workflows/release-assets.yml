name: Publish verified release assets

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      artifacts_run_id:
        required: true
        type: string
      supplemental_artifacts_run_id:
        description: Recovery run with verified replacements for missing original wheel artifacts
        required: false
        default: ""
        type: string
      supplemental_artifact_directory:
        description: Artifact name when exactly one recovered wheel is downloaded
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  release:
    name: publish release
    # Package tests and examples must pass before immutable registry publication.
    # A failed build still leaves diagnostics in Actions artifacts.
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Check out reviewed publication tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: release-tools
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifacts_run_id }}

      - name: Download verified recovered wheels
        if: ${{ inputs.supplemental_artifacts_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-wheel-*
          path: artifacts/${{ inputs.supplemental_artifact_directory }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.supplemental_artifacts_run_id }}

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -d artifacts ]; then
            find artifacts -type f \
              \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.tgz' -o -name '*.node' \
              -o -name 'uqa-cli-*.zip' -o -name 'uqa-cli-*.sha256' \
              -o -name 'uqa-c-*.zip' -o -name 'uqa-c-*.sha256' \
              -o -name 'install-usql.sh' -o -name 'install-usql.ps1' \) \
              -exec cp {} dist/ \;
          fi
          ls -la dist

      - name: Retain existing release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          : > existing-release-assets.txt
          if gh release view "$TAG" --json assets --jq '.assets[].name' > existing-release-assets.txt; then
            while IFS= read -r filename; do
              case "$filename" in
                *.whl|*.tar.gz|*.tgz|*.node|uqa-cli-*.zip|uqa-cli-*.sha256|uqa-c-*.zip|uqa-c-*.sha256|install-usql.sh|install-usql.ps1)
                  gh release download "$TAG" --pattern "$filename" --dir dist --clobber
                  ;;
              esac
            done < existing-release-assets.txt
          fi

      # Every artifact this workflow can produce, by upload name. Anything
      # absent means its build job failed, so it is reported rather than
      # quietly omitted.
      - name: Record which packages are present
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            python-sdist
            python-wheel-x86_64-unknown-linux-gnu
            python-wheel-aarch64-unknown-linux-gnu
            python-wheel-x86_64-apple-darwin
            python-wheel-aarch64-apple-darwin
            python-wheel-x86_64-pc-windows-msvc
            python-wheel-aarch64-pc-windows-msvc
            node-packages
            node-addon-x86_64-unknown-linux-gnu
            node-addon-aarch64-unknown-linux-gnu
            node-addon-x86_64-apple-darwin
            node-addon-aarch64-apple-darwin
            node-addon-x86_64-pc-windows-msvc
            node-addon-aarch64-pc-windows-msvc
            wasm-package
          )
          if [ -f scripts/usql-release.py ]; then
            for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
              expected+=("usql-$target")
            done
          fi
          if [ -f scripts/c-bindings-release.py ]; then
            for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
              expected+=("c-bindings-$target")
            done
          fi
          missing=()
          for name in "${expected[@]}"; do
            [ -d "artifacts/$name" ] || missing+=("$name")
          done
          {
            echo "missing<<EOF"
            printf '%s\n' "${missing[@]+"${missing[@]}"}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::release is missing %d package(s): %s\n' \
              "${#missing[@]}" "${missing[*]}"
            exit 1
          fi
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::no packages built; nothing to publish" >&2
            exit 1
          fi

      - name: Verify standalone CLI inventory and release identity
        run: |
          set -euo pipefail
          # Older tagged sources predate standalone CLI publication.
          if [ -f scripts/usql-release.py ]; then
            python3 scripts/usql-release.py verify --directory dist
          fi

      - name: Verify native C package inventory and release identity
        run: |
          set -euo pipefail
          if [ -f scripts/c-bindings-release.py ]; then
            python3 scripts/c-bindings-release.py verify --directory dist
          fi

      # The same contract CI enforces on sources, re-checked on the exact
      # archives that are about to be published. Globs are expanded first so a
      # partial matrix does not pass an unmatched pattern to the checker.
      - name: Verify license contents of published archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.whl dist/*.tar.gz dist/*.tgz dist/uqa-cli-*.zip dist/uqa-c-*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "no archives to verify (native addons only)"
            exit 0
          fi
          python3 scripts/check-release-licenses.py --require-nori --require-kuromoji "${archives[@]}"

      - name: Verify the complete npm archive contents before announcing the release
        id: npm
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          result="$RUNNER_TEMP/npm-root-repair.json"
          python3 release-tools/scripts/npm-release.py repair-root \
            --source-dir crates/uqa-node --version "$version" \
            --archive "dist/cognica-io-uqa-${version}.tgz" --result-file "$result"
          python3 release-tools/scripts/npm-release.py check --version "$version" dist/cognica-io-uqa-*.tgz
          UQA_NPM_RELEASE_ARCHIVE="$GITHUB_WORKSPACE/dist/cognica-io-uqa-${version}.tgz" \
            node --test --test-name-pattern="installed npm package loads both entry points" \
            release-tools/tests/node/test_http_engine.mjs
          python3 - "$result" <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, sys
          print("repaired=" + str(json.load(open(sys.argv[1]))["repaired"]).lower())
          PYTHON

      - name: Build release notes from HISTORY.md
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          MISSING: ${{ steps.inventory.outputs.missing }}
          CRATES_IO_RESULT: success
          SOURCE_RUN_ID: ${{ inputs.artifacts_run_id }}
        run: |
          set -euo pipefail
          python3 - "$TAG" <<'PY' > release-notes.md
          import os
          import pathlib
          import re
          import sys

          tag = sys.argv[1]
          version = tag.lstrip("v")
          text = open("HISTORY.md", encoding="utf-8").read()
          # Take the section for this version, up to the next version heading.
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, text, re.S | re.M)
          print(match.group(1).strip() if match else f"Release {tag}.")
          print()
          print("## Packages")
          print()
          print("Python wheels, a Python source distribution, the Node.js root npm package, `@cognica-io` native optional packages, standalone native addons, and the browser WASM package are attached to this release.")
          print()
          if pathlib.Path("scripts/usql-release.py").is_file():
              print("Standalone `usql` archives for Linux, macOS and Windows (x86_64 and ARM64), SHA-256 checksums, and `install-usql.sh` / `install-usql.ps1` are also attached. The CLI includes Nori, Kuromoji, Arrow and DuckDB. Cargo users can install the binary without compilation using `cargo binstall uqa-cli --strategies crate-meta-data`.")
              print()
          if pathlib.Path("scripts/c-bindings-release.py").is_file():
              print("C shared/static library packages for Linux and macOS (x86_64 and ARM64) and Windows x86_64 are attached with SHA-256 checksums, installed headers, CMake/pkg-config targets and per-target build/license inventories. Their C11/C++17 consumers run against all four storage providers before packaging.")
              print()
          crates_result = os.environ.get("CRATES_IO_RESULT", "unknown")
          if crates_result == "success":
              print(f"crates.io status: Live publication of all public Rust workspace crates at version `{version}` completed by this workflow.")
          else:
              print(f"crates.io status: Live publication did not complete; the crates.io job finished with `{crates_result}`.")
          print()
          print(f"PyPI status: Pending publication of `uqa=={version}` by the dedicated trusted-publishing workflow.")
          print(f"npm status: Pending publication of `@cognica-io/uqa@{version}`, its native packages, and `@cognica-io/uqa-wasm@{version}` by the dedicated trusted-publishing workflow.")

          print()
          print("## Benchmarks")
          print()
          run_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['SOURCE_RUN_ID']}"
          print(f"Release benchmark JSON and Markdown reports come from the successful package-build workflow and are attached separately. See the [measurement status]({run_url}). Each report records its tag, commit, runner, build and workflow attempt. Shared-runner timing is informational and does not establish performance acceptance.")

          missing = [line.strip() for line in os.environ.get("MISSING", "").splitlines()]
          missing = [name for name in missing if name]
          if missing:
              print()
              print("### Builds without new artifacts")
              print()
              print("These builds did not produce new artifacts. Previously published release assets are retained when available; missing assets still require a successful build.")
              print()
              for name in missing:
                  print(f"- `{name}`")

          print()
          print("Licensing: AGPL-3.0-only with optional FOSS and noncommercial application exceptions. See LICENSING.md.")
          print()
          print(f"<!-- uqa-release-publication:{os.environ['GITHUB_RUN_ID']}:{tag}:{os.environ['SOURCE_RUN_ID']} -->")
          PY
          cat release-notes.md

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NPM_ROOT_REPAIRED: ${{ steps.npm.outputs.repaired }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            for archive in dist/*; do
              if [ "${archive##*/}" = "cognica-io-uqa-${TAG#v}.tgz" ] && [ "$NPM_ROOT_REPAIRED" = 'true' ]; then
                gh release upload "$TAG" "$archive" --clobber
              elif ! grep -Fxq "${archive##*/}" existing-release-assets.txt; then
                gh release upload "$TAG" "$archive"
              fi
            done
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "UQA Engine $TAG" \
              --notes-file release-notes.md \
              dist/*
          fi

      - name: Dispatch PyPI publication for a complete Python inventory
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          expected=(
            "uqa-${version}.tar.gz"
            "uqa-${version}-cp38-abi3-macosx_10_12_x86_64.whl"
            "uqa-${version}-cp38-abi3-macosx_11_0_arm64.whl"
            "uqa-${version}-cp38-abi3-manylinux_2_28_aarch64.whl"
            "uqa-${version}-cp38-abi3-manylinux_2_28_x86_64.whl"
            "uqa-${version}-cp38-abi3-win_amd64.whl"
            "uqa-${version}-cp38-abi3-win_arm64.whl"
          )
          release_assets="$RUNNER_TEMP/release-assets.txt"
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$release_assets"
          missing=()
          for filename in "${expected[@]}"; do
            if [ ! -f "dist/$filename" ] || ! grep -Fxq "$filename" "$release_assets"; then
              missing+=("$filename")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::warning::PyPI publication not dispatched; missing Python distributions: %s\n' \
              "${missing[*]}"
            exit 0
          fi
          gh workflow run pypi.yml --ref "$DEFAULT_BRANCH" -f tag="$TAG"

      - name: Dispatch npm publication for a complete npm inventory
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          expected=(
            "cognica-io-uqa-linux-x64-gnu-${version}.tgz"
            "cognica-io-uqa-linux-arm64-gnu-${version}.tgz"
            "cognica-io-uqa-darwin-x64-${version}.tgz"
            "cognica-io-uqa-darwin-arm64-${version}.tgz"
            "cognica-io-uqa-win32-x64-msvc-${version}.tgz"
            "cognica-io-uqa-win32-arm64-msvc-${version}.tgz"
            "cognica-io-uqa-${version}.tgz"
            "cognica-io-uqa-wasm-${version}.tgz"
          )
          release_assets="$RUNNER_TEMP/release-assets.txt"
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$release_assets"
          missing=()
          for filename in "${expected[@]}"; do
            if [ ! -f "dist/$filename" ] || ! grep -Fxq "$filename" "$release_assets"; then
              missing+=("$filename")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::warning::npm publication not dispatched; missing npm distributions: %s\n' \
              "${missing[*]}"
            exit 0
          fi
          gh workflow run npmjs.yml --ref "$DEFAULT_BRANCH" -f tag="$TAG"

  benchmark-reports:
    name: attach release benchmark reports
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN_ID: ${{ inputs.artifacts_run_id }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-benchmarks-${{ inputs.tag }}-${{ inputs.artifacts_run_id }}-*
          merge-multiple: true
          path: benchmark-reports
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifacts_run_id }}
      - name: Verify report release identities
        run: |
          set -euo pipefail
          export RELEASE_COMMIT
          RELEASE_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          reports = Path("benchmark-reports")
          files = sorted(reports.glob("*.json"))
          if not files:
              raise SystemExit("No release benchmark reports were produced; inspect the benchmark job.")
          expected = set()
          for path in files:
              report = json.loads(path.read_text())
              source = report["provenance"]
              identity = (source["tag"], source["commit"], source["repository"], source["run_id"])
              wanted = tuple(os.environ[key] for key in ("RELEASE_TAG", "RELEASE_COMMIT", "GITHUB_REPOSITORY", "SOURCE_RUN_ID"))
              if report["schema_version"] != 1 or identity != wanted or source["performance_acceptance"] is not False:
                  raise SystemExit(f"Report provenance differs from this release: {path.name}")
              attempt = source["run_attempt"]
              if not isinstance(attempt, str) or not attempt.isdigit():
                  raise SystemExit(f"Invalid report attempt: {path.name}")
              stem = f"release-benchmarks-{source['tag']}-{source['run_id']}-{attempt}"
              if path.name != f"{stem}.json" or not path.with_suffix(".md").is_file():
                  raise SystemExit(f"Report inventory differs: {path.name}")
              expected.update((path.name, path.with_suffix(".md").name))
          if {path.name for path in reports.iterdir()} != expected:
              raise SystemExit("Unexpected files in release benchmark reports")
          PY
      - name: Attach the reports without editing package publication status
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber benchmark-reports/*.json benchmark-reports/*.md
