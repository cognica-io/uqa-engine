name: Recover verified release publication

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/release-recovery.yml
      - .github/workflows/release-assets.yml
      - .github/workflows/python-wheels.yml
      - .github/workflows/release.yml
      - scripts/resolve-release-recovery.py
      - scripts/check-published-crate.py
      - scripts/package-publishable-crates.sh
      - scripts/publish-crates.sh

permissions:
  contents: read
  actions: read

concurrency:
  group: recover-release-publication
  cancel-in-progress: false

jobs:
  resolve:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      run_id: ${{ steps.source.outputs.run_id }}
      python_repair: ${{ steps.source.outputs.python_repair }}
      repair_matrix: ${{ steps.source.outputs.repair_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: source
        name: Verify original build outcomes and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/resolve-release-recovery.py

  python:
    name: repair Python artifacts
    needs: [resolve]
    if: ${{ needs.resolve.outputs.ready == 'true' && needs.resolve.outputs.python_repair == 'true' }}
    uses: ./.github/workflows/python-wheels.yml
    with:
      full_matrix: true
      source_ref: ${{ needs.resolve.outputs.commit }}
      repair_matrix: ${{ needs.resolve.outputs.repair_matrix }}
      artifacts_run_id: ${{ contains(needs.resolve.outputs.repair_matrix, 'x86_64-unknown-linux-gnu') && github.run_id || needs.resolve.outputs.run_id }}

  verify:
    name: verify recovered artifacts
    needs: [resolve, python]
    if: ${{ !cancelled() && needs.resolve.outputs.ready == 'true' && (needs.python.result == 'success' || (needs.resolve.outputs.python_repair == 'false' && needs.python.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create recovered artifact directory
        run: mkdir -p recovered-artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.resolve.outputs.repair_matrix != '[]' }}
        with:
          pattern: python-wheel-*
          path: recovered-artifacts
      - name: Verify original source and recovered archive digests
        env:
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          REPAIR_MATRIX: ${{ needs.resolve.outputs.repair_matrix }}
        run: |
          python3 scripts/resolve-release-recovery.py --verify-repair recovered-artifacts \
            --commit "$RELEASE_COMMIT" --tag "$RELEASE_TAG" --matrix "$REPAIR_MATRIX"

  crates:
    needs: [resolve, verify]
    if: ${{ needs.resolve.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: release-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        run: bash release-tools/.github/scripts/free-linux-runner-disk.sh
      - name: Build all original crate archives and finish publication
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          UQA_RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
        run: |
          set -euo pipefail
          test -n "${CARGO_REGISTRY_TOKEN:-}"
          bash release-tools/scripts/publish-crates.sh --live --retry-rate-limits

  release:
    needs: [resolve, crates]
    if: ${{ needs.resolve.outputs.ready == 'true' }}
    uses: ./.github/workflows/release-assets.yml
    permissions:
      actions: write
      contents: write
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      artifacts_run_id: ${{ needs.resolve.outputs.run_id }}
      supplemental_artifacts_run_id: ${{ needs.resolve.outputs.repair_matrix != '[]' && github.run_id || '' }}
