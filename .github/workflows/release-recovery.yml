name: Recover verified release publication

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/release-recovery.yml
      - .github/workflows/release-assets.yml
      - scripts/resolve-release-recovery.py
      - scripts/check-published-crate.py
      - scripts/package-publishable-crates.sh
      - scripts/publish-crates.sh

permissions:
  contents: read
  actions: read

concurrency:
  group: recover-release-publication
  cancel-in-progress: false

jobs:
  resolve:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: source
        name: Verify original build outcomes and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/resolve-release-recovery.py

  crates:
    needs: [resolve]
    if: ${{ needs.resolve.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          path: release-tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: release-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        run: bash release-tools/.github/scripts/free-linux-runner-disk.sh
      - name: Build all original crate archives and finish publication
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          UQA_RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
        run: |
          set -euo pipefail
          test -n "${CARGO_REGISTRY_TOKEN:-}"
          bash release-tools/scripts/publish-crates.sh --live --retry-rate-limits

  release:
    needs: [resolve, crates]
    if: ${{ needs.resolve.outputs.ready == 'true' }}
    uses: ./.github/workflows/release-assets.yml
    permissions:
      actions: write
      contents: write
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      artifacts_run_id: ${{ needs.resolve.outputs.run_id }}
