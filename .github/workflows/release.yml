name: Release

# Pushing a `v*` tag builds every distributable package and publishes a
# GitHub release with all of them attached. After all seven Python
# distributions and all eight npm distributions are attached, this workflow
# explicitly dispatches the idempotent trusted-publishing workflows. Each one
# records successful registry publication in the GitHub release notes.
# crates.io stays dry-run unless workflow_dispatch sets publish_crates_io.
# A requested live publish fails loudly when CARGO_REGISTRY_TOKEN is absent.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing tag to build and release, for example v0.1.0. Run this
          workflow from that same tag ref so the jobs build the tagged commit.
        required: true
        type: string
      publish_crates_io:
        description: Publish public Rust crates to crates.io
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  resolve:
    name: resolve tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  python:
    name: python
    uses: ./.github/workflows/python-wheels.yml
    with:
      full_matrix: true

  node:
    name: node ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - label: linux aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - label: macos x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - label: macos aarch64
            os: macos-14
            target: aarch64-apple-darwin
          - label: windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: windows aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: false

      - name: Install Node build dependencies
        working-directory: crates/uqa-node
        run: npm ci --ignore-scripts

      # `release` keeps line tables for profiling, which macOS and Windows
      # split into .dSYM/.pdb but Linux leaves inside the binary: the published
      # Linux addons came out at 1.2 GB against 60-90 MB elsewhere. The
      # workspace already defines a stripped profile for exactly this.
      - name: Build native addon
        working-directory: crates/uqa-node
        run: npx napi build --platform --no-js --profile release-stripped --target ${{ matrix.target }}

      - name: Test the addon
        if: matrix.target != 'aarch64-pc-windows-msvc'
        working-directory: crates/uqa-node
        shell: bash
        run: node --test ../../tests/node/test_uqa_node.mjs

      - name: Run Node.js examples
        if: matrix.target != 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          for example in examples/node/*.mjs; do
            node "$example"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: node-addon-${{ matrix.target }}
          path: crates/uqa-node/*.node
          if-no-files-found: error

  node-package:
    name: node npm packages
    needs: node
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Node package tooling
        working-directory: crates/uqa-node
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: node-addon-*
          path: native-addons
          merge-multiple: true
      - name: Assemble the root and platform npm packages
        run: >-
          python3 scripts/npm-release.py build-node
          --artifacts-dir native-addons
          --output-dir dist
      - name: Check npm package license contents
        run: python3 scripts/check-release-licenses.py dist/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: node-packages
          path: dist/*.tgz
          if-no-files-found: error

  wasm:
    name: wasm package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The build asserts its own exception/longjmp contract (see
      # scripts/build-wasm.sh), so it does not depend on a specific emscripten
      # release. Pinning an old one instead risks a toolchain that predates the
      # Rust standard library shipped for wasm32-unknown-emscripten.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      # Belt and braces: the build cross-compiles every dependency, so a
      # missing rust-std for this target surfaces as a confusing
      # "can't find crate for `core`" on the first dependency rather than as a
      # toolchain error.
      - name: Ensure the emscripten target is installed
        run: rustup target add wasm32-unknown-emscripten

      - name: Free Linux runner disk
        run: bash .github/scripts/free-linux-runner-disk.sh

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: false

      - name: Build the browser WASM bundle
        run: bash scripts/build-wasm.sh

      - name: Test the browser WASM bundle
        run: node --test tests/wasm/test_uqa_wasm.mjs

      - name: Run Browser WASM examples
        run: |
          set -euo pipefail
          for name in unified-search vector-knn graph-cypher storage-transactions extensibility; do
            node "examples/browser/${name}.mjs"
          done

      - name: Pack the WASM package
        working-directory: crates/uqa-wasm/js
        run: npm pack --pack-destination .

      - name: Check package license contents
        run: python3 scripts/check-release-licenses.py crates/uqa-wasm/js/*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: crates/uqa-wasm/js/*.tgz
          if-no-files-found: error

  crates-io:
    name: crates.io
    needs: [resolve]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Free Linux runner disk
        run: bash .github/scripts/free-linux-runner-disk.sh

      - name: Package publishable crates
        run: bash scripts/package-publishable-crates.sh

      - name: Publish or dry-run crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PUBLISH_CRATES_IO: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_crates_io || false }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_CRATES_IO" = "true" ]; then
            if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
              echo "::error::publish_crates_io=true requires CARGO_REGISTRY_TOKEN" >&2
              exit 1
            fi
            bash scripts/publish-crates.sh --live --retry-rate-limits
          else
            bash scripts/publish-crates.sh
          fi

  release:
    name: publish release
    needs: [resolve, python, node, node-package, wasm, crates-io]
    # Publish whatever built. One platform failing should not withhold the
    # packages that are ready; the missing ones are named in the release notes
    # and re-running the workflow uploads them alongside, so a release is
    # completed rather than restarted. `!cancelled()` still skips the job when
    # the run was cancelled deliberately.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -d artifacts ]; then
            find artifacts -type f \
              \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.tgz' -o -name '*.node' \) \
              -exec cp {} dist/ \;
          fi
          ls -la dist

      # Every artifact this workflow can produce, by upload name. Anything
      # absent means its build job failed, so it is reported rather than
      # quietly omitted.
      - name: Record which packages are present
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            python-sdist
            python-wheel-x86_64-unknown-linux-gnu
            python-wheel-aarch64-unknown-linux-gnu
            python-wheel-x86_64-apple-darwin
            python-wheel-aarch64-apple-darwin
            python-wheel-x86_64-pc-windows-msvc
            python-wheel-aarch64-pc-windows-msvc
            node-packages
            node-addon-x86_64-unknown-linux-gnu
            node-addon-aarch64-unknown-linux-gnu
            node-addon-x86_64-apple-darwin
            node-addon-aarch64-apple-darwin
            node-addon-x86_64-pc-windows-msvc
            node-addon-aarch64-pc-windows-msvc
            wasm-package
          )
          missing=()
          for name in "${expected[@]}"; do
            [ -d "artifacts/$name" ] || missing+=("$name")
          done
          {
            echo "missing<<EOF"
            printf '%s\n' "${missing[@]+"${missing[@]}"}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::warning::release is missing %d package(s): %s\n' \
              "${#missing[@]}" "${missing[*]}"
          fi
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::no packages built; nothing to publish" >&2
            exit 1
          fi

      # The same contract CI enforces on sources, re-checked on the exact
      # archives that are about to be published. Globs are expanded first so a
      # partial matrix does not pass an unmatched pattern to the checker.
      - name: Verify license contents of published archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.whl dist/*.tar.gz dist/*.tgz)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "no archives to verify (native addons only)"
            exit 0
          fi
          python3 scripts/check-release-licenses.py "${archives[@]}"

      - name: Build release notes from HISTORY.md
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          MISSING: ${{ steps.inventory.outputs.missing }}
          CRATES_IO_RESULT: ${{ needs.crates-io.result }}
          PUBLISH_CRATES_IO: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_crates_io || false }}
        run: |
          set -euo pipefail
          python3 - "$TAG" <<'PY' > release-notes.md
          import os
          import re
          import sys

          tag = sys.argv[1]
          version = tag.lstrip("v")
          text = open("HISTORY.md", encoding="utf-8").read()
          # Take the section for this version, up to the next version heading.
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, text, re.S | re.M)
          print(match.group(1).strip() if match else f"Release {tag}.")
          print()
          print("## Packages")
          print()
          print("Python wheels, a Python source distribution, the Node.js root npm package, `@cognica-io` native optional packages, standalone native addons, and the browser WASM package are attached to this release.")
          print()
          crates_requested = os.environ.get("PUBLISH_CRATES_IO") == "true"
          crates_result = os.environ.get("CRATES_IO_RESULT", "unknown")
          if crates_requested and crates_result == "success":
              print(f"crates.io status: Live publication of all public Rust workspace crates at version `{version}` completed by this workflow.")
          elif crates_requested:
              print(f"crates.io status: Live publication was requested, but the crates.io job finished with `{crates_result}`.")
          elif crates_result == "success":
              print("crates.io status: Package validation completed in dry-run mode; no live upload was requested.")
          else:
              print(f"crates.io status: Dry-run package validation finished with `{crates_result}`.")
          print()
          print(f"PyPI status: Pending publication of `uqa=={version}` by the dedicated trusted-publishing workflow.")
          print(f"npm status: Pending publication of `@cognica-io/uqa@{version}`, its native packages, and `@cognica-io/uqa-wasm@{version}` by the dedicated trusted-publishing workflow.")

          missing = [line.strip() for line in os.environ.get("MISSING", "").splitlines()]
          missing = [name for name in missing if name]
          if missing:
              print()
              print("### Packages not in this release")
              print()
              print("These builds did not succeed, so their packages are absent. Re-running the release workflow for this tag uploads them alongside the assets already published.")
              print()
              for name in missing:
                  print(f"- `{name}`")

          print()
          print("Licensing: AGPL-3.0-only with optional FOSS and noncommercial application exceptions. See LICENSING.md.")
          PY
          cat release-notes.md

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "UQA Engine $TAG" \
              --notes-file release-notes.md \
              dist/*
          fi

      - name: Dispatch PyPI publication for a complete Python inventory
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          expected=(
            "uqa-${version}.tar.gz"
            "uqa-${version}-cp38-abi3-macosx_10_12_x86_64.whl"
            "uqa-${version}-cp38-abi3-macosx_11_0_arm64.whl"
            "uqa-${version}-cp38-abi3-manylinux_2_28_aarch64.whl"
            "uqa-${version}-cp38-abi3-manylinux_2_28_x86_64.whl"
            "uqa-${version}-cp38-abi3-win_amd64.whl"
            "uqa-${version}-cp38-abi3-win_arm64.whl"
          )
          release_assets="$RUNNER_TEMP/release-assets.txt"
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$release_assets"
          missing=()
          for filename in "${expected[@]}"; do
            if [ ! -f "dist/$filename" ] || ! grep -Fxq "$filename" "$release_assets"; then
              missing+=("$filename")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::warning::PyPI publication not dispatched; missing Python distributions: %s\n' \
              "${missing[*]}"
            exit 0
          fi
          gh workflow run pypi.yml --ref "$DEFAULT_BRANCH" -f tag="$TAG"

      - name: Dispatch npm publication for a complete npm inventory
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          expected=(
            "cognica-io-uqa-linux-x64-gnu-${version}.tgz"
            "cognica-io-uqa-linux-arm64-gnu-${version}.tgz"
            "cognica-io-uqa-darwin-x64-${version}.tgz"
            "cognica-io-uqa-darwin-arm64-${version}.tgz"
            "cognica-io-uqa-win32-x64-msvc-${version}.tgz"
            "cognica-io-uqa-win32-arm64-msvc-${version}.tgz"
            "cognica-io-uqa-${version}.tgz"
            "cognica-io-uqa-wasm-${version}.tgz"
          )
          release_assets="$RUNNER_TEMP/release-assets.txt"
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$release_assets"
          missing=()
          for filename in "${expected[@]}"; do
            if [ ! -f "dist/$filename" ] || ! grep -Fxq "$filename" "$release_assets"; then
              missing+=("$filename")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::warning::npm publication not dispatched; missing npm distributions: %s\n' \
              "${missing[*]}"
            exit 0
          fi
          gh workflow run npmjs.yml --ref "$DEFAULT_BRANCH" -f tag="$TAG"
