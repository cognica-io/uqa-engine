name: Release

# Pushing a `v*` tag builds every distributable package and publishes a
# GitHub release with all of them attached. Nothing is pushed to PyPI or npm:
# the artifacts are attached to the release only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing tag to build and release, for example v0.1.0. Run this
          workflow from that same tag ref so the jobs build the tagged commit.
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  resolve:
    name: resolve tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  python:
    name: python
    uses: ./.github/workflows/python-wheels.yml

  node:
    name: node ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - label: linux aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - label: macos x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - label: macos aarch64
            os: macos-14
            target: aarch64-apple-darwin
          - label: windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: windows aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: false

      # There is no lockfile in crates/uqa-node, so `npm ci` cannot be used.
      - name: Install Node build dependencies
        working-directory: crates/uqa-node
        run: npm install

      - name: Build native addon
        working-directory: crates/uqa-node
        run: npx napi build --platform --release --target ${{ matrix.target }}

      - name: Smoke test the addon
        if: matrix.target != 'aarch64-pc-windows-msvc'
        working-directory: crates/uqa-node
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const uqa = require('./index.js');
            const engine = new uqa.Engine();
            const result = engine.sqlSync('SELECT 1 AS n');
            if (result.rows[0].n !== 1) {
              throw new Error('unexpected result: ' + JSON.stringify(result.rows));
            }
            console.log('node addon smoke test OK');
          "

      - uses: actions/upload-artifact@v4
        with:
          name: node-addon-${{ matrix.target }}
          path: crates/uqa-node/*.node
          if-no-files-found: error

  node-package:
    name: node package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pack the JavaScript package
        working-directory: crates/uqa-node
        run: npm pack --pack-destination .
      - name: Check package license contents
        run: python3 scripts/check-release-licenses.py crates/uqa-node/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: node-package
          path: crates/uqa-node/*.tgz
          if-no-files-found: error

  wasm:
    name: wasm package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The build asserts its own exception/longjmp contract (see
      # scripts/build-wasm.sh), so it does not depend on a specific emscripten
      # release. Pinning an old one instead risks a toolchain that predates the
      # Rust standard library shipped for wasm32-unknown-emscripten.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      # Belt and braces: the build cross-compiles every dependency, so a
      # missing rust-std for this target surfaces as a confusing
      # "can't find crate for `core`" on the first dependency rather than as a
      # toolchain error.
      - name: Ensure the emscripten target is installed
        run: rustup target add wasm32-unknown-emscripten

      - name: Free Linux runner disk
        run: bash .github/scripts/free-linux-runner-disk.sh

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: false

      - name: Build the browser WASM bundle
        run: bash scripts/build-wasm.sh

      - name: Pack the WASM package
        working-directory: crates/uqa-wasm/js
        run: npm pack --pack-destination .

      - name: Check package license contents
        run: python3 scripts/check-release-licenses.py crates/uqa-wasm/js/*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: crates/uqa-wasm/js/*.tgz
          if-no-files-found: error

  release:
    name: publish release
    needs: [resolve, python, node, node-package, wasm]
    # Publish whatever built. One platform failing should not withhold the
    # packages that are ready; the missing ones are named in the release notes
    # and re-running the workflow uploads them alongside, so a release is
    # completed rather than restarted. `!cancelled()` still skips the job when
    # the run was cancelled deliberately.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -d artifacts ]; then
            find artifacts -type f \
              \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.tgz' -o -name '*.node' \) \
              -exec cp {} dist/ \;
          fi
          ls -la dist

      # Every artifact this workflow can produce, by upload name. Anything
      # absent means its build job failed, so it is reported rather than
      # quietly omitted.
      - name: Record which packages are present
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            python-sdist
            python-wheel-x86_64-unknown-linux-gnu
            python-wheel-aarch64-unknown-linux-gnu
            python-wheel-x86_64-apple-darwin
            python-wheel-aarch64-apple-darwin
            python-wheel-x86_64-pc-windows-msvc
            python-wheel-aarch64-pc-windows-msvc
            node-package
            node-addon-x86_64-unknown-linux-gnu
            node-addon-aarch64-unknown-linux-gnu
            node-addon-x86_64-apple-darwin
            node-addon-aarch64-apple-darwin
            node-addon-x86_64-pc-windows-msvc
            node-addon-aarch64-pc-windows-msvc
            wasm-package
          )
          missing=()
          for name in "${expected[@]}"; do
            [ -d "artifacts/$name" ] || missing+=("$name")
          done
          {
            echo "missing<<EOF"
            printf '%s\n' "${missing[@]+"${missing[@]}"}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::warning::release is missing %d package(s): %s\n' \
              "${#missing[@]}" "${missing[*]}"
          fi
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::no packages built; nothing to publish" >&2
            exit 1
          fi

      # The same contract CI enforces on sources, re-checked on the exact
      # archives that are about to be published. Globs are expanded first so a
      # partial matrix does not pass an unmatched pattern to the checker.
      - name: Verify license contents of published archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.whl dist/*.tar.gz dist/*.tgz)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "no archives to verify (native addons only)"
            exit 0
          fi
          python3 scripts/check-release-licenses.py "${archives[@]}"

      - name: Build release notes from HISTORY.md
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          MISSING: ${{ steps.inventory.outputs.missing }}
        run: |
          set -euo pipefail
          python3 - "$TAG" <<'PY' > release-notes.md
          import os
          import re
          import sys

          tag = sys.argv[1]
          version = tag.lstrip("v")
          text = open("HISTORY.md", encoding="utf-8").read()
          # Take the section for this version, up to the next version heading.
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, text, re.S | re.M)
          print(match.group(1).strip() if match else f"Release {tag}.")
          print()
          print("## Packages")
          print()
          print("Python wheels, a Python source distribution, the Node.js")
          print("JavaScript package with per-platform native addons, and the")
          print("browser WASM package are attached to this release. They are")
          print("not published to PyPI or npm.")

          missing = [line.strip() for line in os.environ.get("MISSING", "").splitlines()]
          missing = [name for name in missing if name]
          if missing:
              print()
              print("### Packages not in this release")
              print()
              print("These builds did not succeed, so their packages are absent.")
              print("Re-running the release workflow for this tag uploads them")
              print("alongside the assets already published.")
              print()
              for name in missing:
                  print(f"- `{name}`")

          print()
          print("Licensing: AGPL-3.0-only with optional FOSS and noncommercial")
          print("application exceptions. See LICENSING.md.")
          PY
          cat release-notes.md

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "UQA-RS $TAG" \
              --notes-file release-notes.md \
              dist/*
          fi
