name: Release

# Pushing a `v*` tag builds every distributable package and publishes a
# GitHub release with all of them attached. After all seven Python
# distributions and all eight npm distributions are attached, this workflow
# explicitly dispatches the idempotent trusted-publishing workflows. Each one
# records successful registry publication in the GitHub release notes.
# After the binding suites and examples pass, tag pushes also publish to
# crates.io, which requires CARGO_REGISTRY_TOKEN.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing tag to build and release, for example v0.1.0. Run this
          workflow from that same tag ref so the jobs build the tagged commit.
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  resolve:
    name: resolve tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  python:
    name: python
    uses: ./.github/workflows/python-wheels.yml
    with:
      full_matrix: true

  javascript:
    name: javascript packages
    uses: ./.github/workflows/javascript-packages.yml

  benchmarks:
    name: release benchmarks
    needs: [resolve]
    uses: ./.github/workflows/release-benchmarks.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}

  crates-io:
    name: verify crates and publish to crates.io
    needs: [resolve, python, javascript, benchmarks]
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Free Linux runner disk
        run: bash .github/scripts/free-linux-runner-disk.sh

      - name: Build every crate archive before publishing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::Live crates.io publication requires CARGO_REGISTRY_TOKEN" >&2
            exit 1
          fi
          bash scripts/publish-crates.sh --live --retry-rate-limits

  release:
    name: publish release
    needs: [resolve, python, javascript, crates-io]
    uses: ./.github/workflows/release-assets.yml
    permissions:
      actions: write
      contents: write
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      artifacts_run_id: ${{ github.run_id }}
