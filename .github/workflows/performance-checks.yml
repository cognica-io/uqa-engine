name: Performance regression checks

on:
  pull_request:
    paths:
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .config/nextest.toml
      - .github/actions/setup-nextest/**
      - .github/workflows/performance-checks.yml
      - .github/workflows/performance-platform.yml
      - benchmarks/regressions/**
      - scripts/run-performance-checks.py
      - scripts/tests/test_performance_checks.py
      - scripts/performance_change_scope.py
      - scripts/tests/test_performance_change_scope.py
      - "!benchmarks/regressions/**/*.md"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .config/nextest.toml
      - .github/actions/setup-nextest/**
      - .github/workflows/performance-checks.yml
      - .github/workflows/performance-platform.yml
      - benchmarks/regressions/**
      - scripts/run-performance-checks.py
      - scripts/tests/test_performance_checks.py
      - scripts/performance_change_scope.py
      - scripts/tests/test_performance_change_scope.py
      - "!benchmarks/regressions/**/*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select deterministic regression inputs
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.select.outputs.required }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify input selection
        run: python3 -m unittest discover -s scripts/tests -p test_performance_change_scope.py
      - name: Select changed product and regression inputs
        id: select
        env:
          PERFORMANCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$PERFORMANCE_BASE" || "$PERFORMANCE_BASE" =~ ^0+$ ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin "$PERFORMANCE_BASE"
            git diff --name-only -z --no-renames "$PERFORMANCE_BASE" HEAD | python3 scripts/performance_change_scope.py >> "$GITHUB_OUTPUT"
          fi
  platform:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    name: Regression checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    uses: ./.github/workflows/performance-platform.yml
    with:
      os: ${{ matrix.os }}
