name: Performance regression checks

on:
  pull_request:
    paths:
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .config/nextest.toml
      - .github/actions/setup-nextest/**
      - .github/workflows/performance-checks.yml
      - benchmarks/regressions/**
      - scripts/run-performance-checks.py
      - scripts/tests/test_performance_checks.py
  push:
    branches: [main]
    paths:
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .config/nextest.toml
      - .github/actions/setup-nextest/**
      - .github/workflows/performance-checks.yml
      - benchmarks/regressions/**
      - scripts/run-performance-checks.py
      - scripts/tests/test_performance_checks.py

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  deterministic-work:
    name: Deterministic work and memory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-nextest
      - name: Verify the regression inventory and failure detection
        run: python3 -m unittest discover -s scripts/tests -p test_performance_checks.py
      - name: Check bounded work, memory and output correctness
        run: python3 scripts/run-performance-checks.py
      - name: Verify independent-process claim workload without timing
        run: cargo run -p uqa-execution --example row_claim_contention --locked -- --verify > target/performance-checks/claim-contention.json
      - name: Retain regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-checks-${{ matrix.os }}
          path: |
            target/nextest/ci/junit.xml
            target/performance-checks/
          if-no-files-found: error
          retention-days: 7
