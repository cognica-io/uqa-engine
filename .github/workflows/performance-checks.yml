name: Performance regression checks

on:
  pull_request:
    paths:
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .config/nextest.toml
      - .github/actions/setup-nextest/**
      - .github/workflows/performance-checks.yml
      - .github/workflows/performance-platform.yml
      - benchmarks/regressions/**
      - scripts/run-performance-checks.py
      - scripts/tests/test_performance_checks.py
  push:
    branches: [main]
    paths:
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .config/nextest.toml
      - .github/actions/setup-nextest/**
      - .github/workflows/performance-checks.yml
      - .github/workflows/performance-platform.yml
      - benchmarks/regressions/**
      - scripts/run-performance-checks.py
      - scripts/tests/test_performance_checks.py

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Regression checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    uses: ./.github/workflows/performance-platform.yml
    with:
      os: ${{ matrix.os }}
