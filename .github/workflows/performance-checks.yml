name: Performance regression checks

on:
  pull_request:
    paths:
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .config/nextest.toml
      - .github/actions/setup-nextest/**
      - .github/workflows/performance-checks.yml
      - benchmarks/regressions/**
      - scripts/run-performance-checks.py
      - scripts/tests/test_performance_checks.py
  push:
    branches: [main]
    paths:
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .config/nextest.toml
      - .github/actions/setup-nextest/**
      - .github/workflows/performance-checks.yml
      - benchmarks/regressions/**
      - scripts/run-performance-checks.py
      - scripts/tests/test_performance_checks.py

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  # Match workspace tests: optimized binaries with debug assertions and overflow checks.
  CARGO_PROFILE_DEV_OPT_LEVEL: "2"
  CARGO_PROFILE_TEST_OPT_LEVEL: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  build:
    name: Build regression archive (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Use the workspace's compilation job bound; execution keeps its own deadline below.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-nextest
      - name: Verify the regression inventory and failure detection
        run: python3 -m unittest discover -s scripts/tests -p test_performance_checks.py
      - name: Build the selected existing test targets
        run: python3 scripts/run-performance-checks.py --build-archive "$RUNNER_TEMP/uqa-performance-tests.tar.zst"
      - name: Build the independent-process claim fixture
        run: |
          cargo build -p uqa-execution --example row_claim_contention --locked
          tar -czf "$RUNNER_TEMP/uqa-claim-fixture.tar.gz" -C target/debug/examples row_claim_contention
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: performance-binaries-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/uqa-performance-tests.tar.zst
            ${{ runner.temp }}/uqa-claim-fixture.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  deterministic-work:
    name: Deterministic work and memory (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-nextest
      - uses: actions/download-artifact@v8.0.2
        with:
          name: performance-binaries-${{ matrix.os }}
          path: ${{ runner.temp }}
      - name: Check bounded work, memory and output correctness
        run: python3 scripts/run-performance-checks.py --archive-file "$RUNNER_TEMP/uqa-performance-tests.tar.zst"
      - name: Verify independent-process claim workload without timing
        run: |
          tar -xzf "$RUNNER_TEMP/uqa-claim-fixture.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/row_claim_contention" --verify > target/performance-checks/claim-contention.json
      - name: Retain regression results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: performance-checks-${{ matrix.os }}
          path: |
            target/nextest/ci/junit.xml
            target/performance-checks/
          if-no-files-found: error
          retention-days: 7
