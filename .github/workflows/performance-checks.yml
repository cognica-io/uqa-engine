name: Performance regression checks

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - ".github/actions/select-validation-inputs/**"
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .config/nextest.toml
      - .github/actions/setup-nextest/**
      - .github/workflows/performance-checks.yml
      - .github/workflows/performance-platform.yml
      - benchmarks/regressions/**
      - scripts/run-performance-checks.py
      - scripts/tests/test_performance_checks.py
      - scripts/performance_change_scope.py
      - scripts/tests/test_performance_change_scope.py
      - "!benchmarks/regressions/**/*.md"
  push:
    branches: [main]
    paths:
      - ".github/actions/select-validation-inputs/**"
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .config/nextest.toml
      - .github/actions/setup-nextest/**
      - .github/workflows/performance-checks.yml
      - .github/workflows/performance-platform.yml
      - benchmarks/regressions/**
      - scripts/run-performance-checks.py
      - scripts/tests/test_performance_checks.py
      - scripts/performance_change_scope.py
      - scripts/tests/test_performance_change_scope.py
      - "!benchmarks/regressions/**/*.md"

permissions:
  contents: read

jobs:
  scope:
    name: Select regression inputs
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.select.outputs.required }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: select
        uses: ./.github/actions/select-validation-inputs
        with:
          kind: regression
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          before: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
  platform:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    name: Regression checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    uses: ./.github/workflows/performance-platform.yml
    with:
      os: ${{ matrix.os }}
