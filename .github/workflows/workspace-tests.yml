name: Workspace tests

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      check-regressions:
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ${{ inputs.os == 'ubuntu-24.04' && '-D warnings -C linker-features=-lld' || '-D warnings' }}
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  # Test binaries are optimized and keep debug assertions and overflow checks, as the suites run locally: they run faster than unoptimized binaries and take longer to compile.
  CARGO_PROFILE_DEV_OPT_LEVEL: "2"
  CARGO_PROFILE_TEST_OPT_LEVEL: "2"

jobs:
  build:
    name: Build workspace tests and validate local macOS suites
    runs-on: ${{ inputs.os == 'macos-26-arm64' && fromJSON('["self-hosted","macOS","ARM64","macos-arm64","macos-26-arm64"]') || inputs.os }}
    # The macOS workers share one disk. Keep the complete test and regression batch on one worker.
    concurrency:
      group: workspace-tests-${{ inputs.os }}-${{ inputs.os == 'macos-26-arm64' && 'shared-host' || github.run_id }}
      queue: max
    # macOS also executes the full suite here. Linux compiles two optimized test targets at a time.
    timeout-minutes: ${{ inputs.os == 'macos-26-arm64' && 240 || 90 }}
    outputs:
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - name: Limit shared macOS worker parallelism
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          printf '%s\n' 'CARGO_BUILD_JOBS=4' 'RUST_TEST_THREADS=4' 'NEXTEST_TEST_THREADS=4' \
            "RUSTUP_HOME=$RUNNER_TOOL_CACHE/rustup" "CARGO_HOME=$RUNNER_TOOL_CACHE/cargo" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TOOL_CACHE/cargo/bin"
          printf '%s\n' "$RUNNER_TOOL_CACHE/cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select macOS regression inputs
        if: runner.os == 'macOS' && inputs.check-regressions
        id: regression
        uses: ./.github/actions/select-validation-inputs
        with:
          kind: regression
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ (runner.os != 'macOS' || runner.environment != 'self-hosted') && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-nextest
      - name: Build workspace tests once
        timeout-minutes: ${{ runner.os == 'Linux' && 90 || 60 }}
        env:
          CARGO_BUILD_JOBS: ${{ runner.os == 'Linux' && '2' || env.CARGO_BUILD_JOBS }}
        shell: bash
        run: |
          args=(--workspace --locked)
          if [[ "$RUNNER_OS" == Linux ]]; then args+=(--exclude uqa-fdw); fi
          cargo nextest archive "${args[@]}" --archive-file "$RUNNER_TEMP/uqa-tests.tar.zst"
      - name: Fingerprint the completed test archive
        id: archive
        shell: bash
        run: |
          archive_checksum="$(shasum -a 256 "$RUNNER_TEMP/uqa-tests.tar.zst")"
          echo "sha256=${archive_checksum%% *}" >> "$GITHUB_OUTPUT"
      - name: Run every macOS workspace test on its build worker
        if: runner.os == 'macOS'
        id: workspace
        # The whole-suite budget is separate from the unchanged per-case CI deadlines.
        timeout-minutes: 180
        env:
          # Bound durable test concurrency independently of the other workers sharing this host.
          NEXTEST_TEST_THREADS: "8"
          CHECK_REGRESSIONS: ${{ steps.regression.outputs.required }}
        shell: bash
        run: |
          if [[ "$CHECK_REGRESSIONS" == true ]]; then
            python3 scripts/run-performance-checks.py --record-workspace "$RUNNER_TEMP/workspace-results"
          else
            cargo nextest run --profile ci --workspace --locked
          fi
      - name: Retain macOS workspace test results
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-results-${{ inputs.os }}
          path: ${{ steps.regression.outputs.required == 'true' && format('{0}/workspace-results/junit.xml', runner.temp) || 'target/nextest/ci/junit.xml' }}
          retention-days: 7
          if-no-files-found: error
      - name: Build macOS regression targets and independent-process claim fixture
        id: regression_build
        if: ${{ !cancelled() && steps.regression.outputs.required == 'true' && steps.archive.outcome == 'success' }}
        timeout-minutes: 60
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          python3 -m unittest discover -s scripts/tests -p test_performance_checks.py
          python3 scripts/run-performance-checks.py --build-archive "$RUNNER_TEMP/uqa-performance-tests.tar.zst"
          python3 scripts/run-performance-checks.py --build-claim-fixture
          tar -czf "$RUNNER_TEMP/uqa-claim-fixture.tar.gz" -C target/debug/examples row_claim_contention
      - name: Verify macOS bounded work, memory and output correctness
        if: ${{ !cancelled() && steps.regression_build.outcome == 'success' }}
        timeout-minutes: 120
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          WORKSPACE_OUTCOME: ${{ steps.workspace.outcome }}
        shell: bash
        run: |
          if [[ "$WORKSPACE_OUTCOME" == success ]]; then
            python3 scripts/run-performance-checks.py --workspace-results "$RUNNER_TEMP/workspace-results"
          else
            python3 scripts/run-performance-checks.py --built-in-place
          fi
      - name: Verify macOS independent-process claim workload
        if: ${{ !cancelled() && steps.regression_build.outcome == 'success' }}
        run: |
          mkdir -p target/performance-checks
          target/debug/examples/row_claim_contention --verify > target/performance-checks/claim-contention.json
      - name: Retain macOS regression results
        if: ${{ always() && steps.regression_build.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: performance-checks-${{ inputs.os }}
          path: |
            target/nextest/ci/junit.xml
            target/performance-checks/
          if-no-files-found: error
          retention-days: 7
      - name: Retain macOS regression executables
        if: ${{ !cancelled() && steps.regression_build.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: performance-binaries-${{ inputs.os }}
          path: |
            ${{ runner.temp }}/uqa-performance-tests.tar.zst
            ${{ runner.temp }}/uqa-claim-fixture.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        with:
          name: workspace-tests-${{ inputs.os }}
          path: ${{ runner.temp }}/uqa-tests.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Test documentation examples
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        shell: bash
        run: |
          # Explicit --doc overrides doctest=false; native-only libraries have no Rust doctest target.
          args=(--workspace --locked --doc --exclude uqa-node --exclude uqa-ffi)
          if [[ "$RUNNER_OS" == Linux ]]; then args+=(--exclude uqa-fdw); fi
          cargo test "${args[@]}"

  features:
    name: Verify analyzer feature configurations
    runs-on: ${{ inputs.os == 'macos-26-arm64' && fromJSON('["self-hosted","macOS","ARM64","macos-arm64","macos-26-arm64"]') || inputs.os }}
    timeout-minutes: 90
    steps:
      - name: Limit shared macOS worker parallelism
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          printf '%s\n' 'CARGO_BUILD_JOBS=4' 'RUST_TEST_THREADS=4' 'NEXTEST_TEST_THREADS=4' \
            "RUSTUP_HOME=$RUNNER_TOOL_CACHE/rustup" "CARGO_HOME=$RUNNER_TOOL_CACHE/cargo" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TOOL_CACHE/cargo/bin"
          printf '%s\n' "$RUNNER_TOOL_CACHE/cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: bash .github/scripts/free-linux-runner-disk.sh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ (runner.os != 'macOS' || runner.environment != 'self-hosted') && github.ref == 'refs/heads/main' }}
      - name: Test morphology bundle tools and embedded models
        run: cargo test -p uqa-analysis -p uqa-nori-data -p uqa-kuromoji-data --features uqa-analysis/nori-tools,uqa-analysis/kuromoji-tools --locked
      - name: Verify independent analyzer features
        if: runner.os == 'Linux'
        run: |
          cargo test -p uqa-analysis --features kuromoji-tools --no-default-features --locked
          cargo test -p uqa-storage -p uqa-storage-sqlite -p uqa-storage-redb -p uqa-scoring -p uqa-operators --features uqa-analysis/kuromoji --locked japanese_
          cargo test -p uqa-engine --features kuromoji --test integration --locked kuromoji_
          cargo test -p uqa-engine --no-default-features --test integration --locked kuromoji_
          cargo test -p uqa-cli --features kuromoji --test integration --locked builtin_
          python3 scripts/check-analyzer-feature-isolation.py
      - name: Verify the standalone CLI without morphology dictionaries
        if: runner.os == 'Linux'
        run: |
          cargo test -p uqa-cli --locked --no-default-features --test integration
          cargo tree --locked -p uqa-cli --no-default-features --edges normal > target/cli-without-morphology.txt
          if grep -Eq 'uqa-(nori|kuromoji)-data' target/cli-without-morphology.txt; then
            echo "Morphology dictionary present in the feature-disabled CLI" >&2
            exit 1
          fi

  test:
    name: Test shard ${{ matrix.shard }}/8
    needs: build
    if: inputs.os != 'macos-26-arm64'
    runs-on: ${{ inputs.os == 'macos-26-arm64' && fromJSON('["self-hosted","macOS","ARM64","macos-arm64","macos-26-arm64"]') || inputs.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Limit shared macOS worker parallelism
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          printf '%s\n' 'CARGO_BUILD_JOBS=4' 'RUST_TEST_THREADS=4' 'NEXTEST_TEST_THREADS=4' \
            "RUSTUP_HOME=$RUNNER_TOOL_CACHE/rustup" "CARGO_HOME=$RUNNER_TOOL_CACHE/cargo" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TOOL_CACHE/cargo/bin"
          printf '%s\n' "$RUNNER_TOOL_CACHE/cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nextest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workspace-tests-${{ inputs.os }}
          path: ${{ runner.temp }}
          digest-mismatch: error
      - name: Verify the downloaded test archive
        shell: bash
        env:
          UQA_TEST_ARCHIVE_SHA256: ${{ needs.build.outputs.archive-sha256 }}
        run: |
          test -n "$UQA_TEST_ARCHIVE_SHA256"
          printf '%s  %s\n' "$UQA_TEST_ARCHIVE_SHA256" "$RUNNER_TEMP/uqa-tests.tar.zst" | shasum -a 256 --check
      - name: Run prebuilt workspace tests
        run: >-
          cargo nextest run --profile ci
          --archive-file "$RUNNER_TEMP/uqa-tests.tar.zst"
          --extract-to "$GITHUB_WORKSPACE"
          --workspace-remap "$GITHUB_WORKSPACE"
          --partition slice:${{ matrix.shard }}/8
      - name: Retain individual test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-results-${{ inputs.os }}-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: error
