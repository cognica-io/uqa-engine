name: Set up Python
description: Select the requested Python with an isolated environment on self-hosted macOS.
inputs:
  python-version:
    description: Python major and minor version.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      if: runner.os != 'macOS' || runner.environment != 'self-hosted'
      with:
        python-version: ${{ inputs.python-version }}
    - name: Set up Homebrew Python in a job environment
      if: runner.os == 'macOS' && runner.environment == 'self-hosted'
      shell: bash
      env:
        UQA_PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        case "$UQA_PYTHON_VERSION" in
          3.[0-9]|3.[0-9][0-9]) ;;
          *) echo 'Expected a Python major.minor version.' >&2; exit 1 ;;
        esac
        formula="python@$UQA_PYTHON_VERSION"
        if ! brew list --versions "$formula" >/dev/null 2>&1; then
          brew install "$formula"
        fi
        interpreter="$(brew --prefix "$formula")/bin/python$UQA_PYTHON_VERSION"
        environment="$(mktemp -d "$RUNNER_TEMP/uqa-python.XXXXXX")"
        "$interpreter" -m venv "$environment"
        echo "$environment/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$environment" >> "$GITHUB_ENV"
        "$environment/bin/python" --version
