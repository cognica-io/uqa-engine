name: Package and verify usql
description: Build the native CLI and exercise the installed release archive
inputs:
  target:
    required: true
    description: Native Rust target triple
runs:
  using: composite
  steps:
    - name: Build the CLI with bundled analyzers and foreign handlers
      # Git Bash's incomplete Perl shadows the native Windows build tools.
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      env:
        CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      run: cargo build --locked -p uqa-cli --bin usql --profile release-stripped --features arrow,duckdb --target '${{ inputs.target }}'
    - name: Package the executable, licenses and pinned installers
      shell: bash
      run: python scripts/usql-release.py package --target '${{ inputs.target }}' --directory dist/usql
    - name: Install and exercise the exact release archive
      shell: bash
      run: python scripts/usql-release.py smoke --target '${{ inputs.target }}' --directory dist/usql
    - uses: actions/upload-artifact@v4
      with:
        name: usql-${{ inputs.target }}
        path: dist/usql/*
        if-no-files-found: error
